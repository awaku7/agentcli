name: Tool I18N Missing Reuse
on:
  push:
    branches: [fix/tool-i18n-completeness]
    paths: [".github/workflows/tool-i18n-missing-reuse.yml"]
permissions:
  contents: write
jobs:
  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/tool-i18n-completeness, fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: python scripts/tool_json_i18n_reuse_missing.py
      - run: python scripts/tool_json_i18n_batch.py status --add-lang
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/uagent/tools src/uagent/tools_rust
          git commit -m "fix(i18n): reuse translations for missing tool keys"
          git push origin HEAD:fix/tool-i18n-completeness
