name: PR91 trusted ingress finish

on:
  push:
    branches: [feat/opentelemetry-trusted-ingress]

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/opentelemetry-trusted-ingress
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Preserve raw socket peer before Uvicorn proxy rewrite
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/uagent/web_impl/init.py')
          s = p.read_text(encoding='utf-8')
          if 'RawSocketPeerCaptureMiddleware' not in s:
              s = s.replace(
                  'from .app import app\n',
                  'from uvicorn.middleware.proxy_headers import ProxyHeadersMiddleware\n\n'
                  'from ..runtime.observability.trusted_ingress import RawSocketPeerCaptureMiddleware\n'
                  'from .app import app\n',
                  1,
              )
          old = '    config = uvicorn.Config(app, host=bind_host, port=port, ws_max_size=10_000_000)\n'
          if old not in s:
              raise SystemExit('uvicorn Config anchor not found')
          s = s.replace(
              old,
              '    forwarded_allow_ips = os.environ.get(\n'
              '        "FORWARDED_ALLOW_IPS", "127.0.0.1,::1"\n'
              '    )\n'
              '    proxied_app = ProxyHeadersMiddleware(\n'
              '        app, trusted_hosts=forwarded_allow_ips\n'
              '    )\n'
              '    server_app = RawSocketPeerCaptureMiddleware(proxied_app)\n'
              '    config = uvicorn.Config(\n'
              '        server_app,\n'
              '        host=bind_host,\n'
              '        port=port,\n'
              '        ws_max_size=10_000_000,\n'
              '        proxy_headers=False,\n'
              '    )\n',
              1,
          )
          p.write_text(s, encoding='utf-8')

          p = Path('src/uagent/docs/DEVELOP_OBSERVABILITY.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'actual socket peer matches `UAGENT_OTEL_TRUSTED_PROXY_CIDRS`',
              'raw socket peer captured before Uvicorn proxy-header rewriting matches `UAGENT_OTEL_TRUSTED_PROXY_CIDRS`',
          )
          marker = '- The Web connection is authenticated and authorized before UAG resolves the trusted trace carrier.'
          if 'WebSocket handshake carrier is single-use' not in s and marker in s:
              s = s.replace(
                  marker,
                  '- A WebSocket handshake carrier is single-use: it may parent only the first Agent execution started by that connection. Later turns return to fresh Agent roots, preserving one logical trace per user turn.\n' + marker,
                  1,
              )
          s = s.replace(
              'only a matching socket peer may supply the trusted W3C parent used by the worker\'s canonical Agent span.',
              'only a matching raw socket peer captured before proxy-header rewriting may supply the single-use trusted W3C parent for the first worker Agent span.',
          )
          p.write_text(s, encoding='utf-8')

          p = Path('docs/UAG_OPENTELEMETRY_PHASE3_SCOPE.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '- use the actual socket peer only, never a forwarded client-address header, to select trust;',
              '- capture the raw socket peer before Uvicorn proxy-header rewriting and use only that value, never a forwarded client-address header, to select trust;',
          )
          marker = '- copy only `traceparent` / `tracestate` into the worker thread\'s process-local observability context;'
          if 'consume a WebSocket handshake carrier at most once' not in s and marker in s:
              s = s.replace(
                  marker,
                  marker + '\n- consume a WebSocket handshake carrier at most once so later turns on the long-lived connection start fresh traces;',
                  1,
              )
          p.write_text(s, encoding='utf-8')
          PY
      - name: Format and validate
        shell: bash
        run: |
          python -m pip install -q black==26.5.1 ruff
          python -m black src/uagent/runtime/observability/trusted_ingress.py src/uagent/runtime/execution.py src/uagent/web_impl/routes_ws.py src/uagent/web_impl/init.py tests/test_observability_phase3_trusted_ingress.py
          python -m black --check src/uagent/runtime/observability/trusted_ingress.py src/uagent/runtime/execution.py src/uagent/web_impl/routes_ws.py src/uagent/web_impl/init.py tests/test_observability_phase3_trusted_ingress.py
          python -m ruff check src/uagent/runtime/observability/trusted_ingress.py src/uagent/runtime/execution.py src/uagent/web_impl/routes_ws.py src/uagent/web_impl/init.py tests/test_observability_phase3_trusted_ingress.py
          python -m pip install -q -e ".[core,providers,test]"
          python -m pytest -q tests/test_observability_phase3_trusted_ingress.py tests/test_observability_runtime_tracing.py tests/test_web_connection_identity.py
      - name: Commit final implementation
        shell: bash
        run: |
          git rm .github/workflows/zz_pr91_finish.yml
          git config user.name "Hirofumi Ukawa"
          git config user.email "35913787+awaku7@users.noreply.github.com"
          git add docs/UAG_OPENTELEMETRY_PHASE3_SCOPE.md src/uagent/docs/DEVELOP_OBSERVABILITY.md src/uagent/runtime/observability/trusted_ingress.py src/uagent/runtime/execution.py src/uagent/web_impl/routes_ws.py src/uagent/web_impl/init.py tests/test_observability_phase3_trusted_ingress.py
          git commit -m "fix: preserve trusted ingress boundaries"
          git push origin HEAD:feat/opentelemetry-trusted-ingress
