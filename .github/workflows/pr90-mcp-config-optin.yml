name: PR90 MCP config opt-in

on:
  push:
    branches:
      - feat/opentelemetry-mcp-config-optin

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/opentelemetry-mcp-config-optin
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply MCP config opt-in slice
        shell: bash
        run: |
          echo '...TRUNCATED...==' | base64 -d > /tmp/pr90_patch.py
          python /tmp/pr90_patch.py
      - name: Validate
        shell: bash
        run: |
          python -m pip install -e ".[core,providers,test]"
          python -m pip install black==26.5.1 ruff
          python -m black src/uagent/tools/mcp_servers_shared.py src/uagent/tools/handle_mcp_v2_tool.py src/uagent/tools/mcp/session_pool.py src/uagent/tools/mcp_tools_list_tool.py src/uagent/tools/mcp_resources_tool.py src/uagent/tools/mcp_servers_tool.py tests/test_observability_phase3_mcp_config.py
          python -m black --check src tests
          python -m ruff check src tests
          python -m pytest -q tests/test_observability_phase3_mcp.py tests/test_observability_phase3_mcp_config.py tests/test_mcp_servers_tools_smoke.py
          python scripts/tool_json_i18n_batch.py status
          python scripts/i18n_structure_audit.py --strict --report outputs/i18n/structure_audit.json
          git diff --check
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr90-mcp-config-optin.yml
          git add src/uagent/tools/mcp_servers_shared.py src/uagent/tools/handle_mcp_v2_tool.py src/uagent/tools/mcp/session_pool.py src/uagent/tools/mcp_tools_list_tool.py src/uagent/tools/mcp_resources_tool.py src/uagent/tools/mcp_servers_tool.py src/uagent/tools/mcp_servers_tool.json src/uagent/docs/DEVELOP_OBSERVABILITY.md tests/test_observability_phase3_mcp_config.py
          git diff --cached --check
          git commit -m "feat: wire managed MCP trace opt-in"
          git push origin HEAD:feat/opentelemetry-mcp-config-optin
