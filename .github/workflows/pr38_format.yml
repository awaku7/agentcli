name: PR38 Format

on:
  push:
    branches:
      - feat/session-resume-time-ranges

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/session-resume-time-ranges
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install black
      - run: python -m black tests/test_session_resume_time_ranges.py
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_session_resume_time_ranges.py
          git commit -m "style: format session resume range tests"
          git push origin HEAD:feat/session-resume-time-ranges
