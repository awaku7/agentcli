name: Apply PR 88 review fix

on:
  push:
    branches:
      - feat/opentelemetry-subagent-spans

permissions:
  contents: write

jobs:
  apply-review-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/opentelemetry-subagent-spans
          fetch-depth: 0

      - name: Apply review fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          src = Path("src/uagent/tools/sub_agent_tool.py")
          lines = src.read_text(encoding="utf-8").splitlines(keepends=True)
          token_line = '    sub_agent_token = set_active_sub_agent(agent_name)\n'
          token_idx = lines.index(token_line)
          setup_start = token_idx + 1
          runner_try_idx = next(
              i for i in range(setup_start, len(lines) - 1)
              if lines[i] == '    try:\n' and lines[i + 1] == '        result = _runner.run(\n'
          )
          setup = lines[setup_start:runner_try_idx]
          indented_setup = [("    " + line) if line.strip() else line for line in setup]
          lines[setup_start:runner_try_idx + 1] = ['    try:\n'] + indented_setup
          src.write_text("".join(lines), encoding="utf-8")

          test = Path("tests/test_observability_phase3_subagent.py")
          text = test.read_text(encoding="utf-8")
          import_anchor = 'from uagent.tools import context as tool_context\n'
          import_line = 'from uagent.tools import sub_agent_tool\n'
          if import_line not in text:
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          test_name = 'def test_sub_agent_status_failure_restores_context_and_closes_span('
          if test_name not in text:
              anchor = 'def test_observability_failure_does_not_break_sub_agent_binding(monkeypatch) -> None:\n'
              addition = '''def test_sub_agent_status_failure_restores_context_and_closes_span(monkeypatch) -> None:
    backend = _FakeBackend()
    monkeypatch.setattr(bootstrap, "get_observability_backend", lambda: backend)

    class _Callbacks:
        def set_status(self, active: bool, message: str) -> None:
            if active:
                raise RuntimeError("status unavailable")

    monkeypatch.setattr(sub_agent_tool, "get_callbacks", lambda: _Callbacks())
    reasoning_token = sub_agent_tool._SUB_AGENT_REASONING_OVERRIDE.set("parent")
    try:
        with pytest.raises(RuntimeError, match="status unavailable"):
            sub_agent_tool.run_tool(
                {"agent_name": "planner", "task": "do not execute"}
            )

        assert tool_context.get_active_sub_agent() is None
        assert backend.active.get() == "parent"
        assert sub_agent_tool._SUB_AGENT_REASONING_OVERRIDE.get() == "parent"
    finally:
        sub_agent_tool._SUB_AGENT_REASONING_OVERRIDE.reset(reasoning_token)

    assert backend.calls[0]["exc_type"] is RuntimeError


'''
              if anchor not in text:
                  raise SystemExit("test insertion anchor not found")
              text = text.replace(anchor, addition + anchor, 1)
          test.write_text(text, encoding="utf-8")
          PY

          python -m py_compile src/uagent/tools/sub_agent_tool.py tests/test_observability_phase3_subagent.py
          git diff --check
          git diff -- src/uagent/tools/sub_agent_tool.py tests/test_observability_phase3_subagent.py

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr88-review-fix.yml
          git add src/uagent/tools/sub_agent_tool.py tests/test_observability_phase3_subagent.py
          git diff --cached --check
          git commit -m "fix: clean up sub-agent state on setup failure"
          git push origin HEAD:feat/opentelemetry-subagent-spans
