name: Format Foundry Local fix

on:
  push:
    branches:
      - fix/foundry-local-multiturn-500
    paths:
      - src/uagent/providers/llm_foundry_local.py
      - tests/test_foundry_local_runtime_regressions.py
      - .github/workflows/format-foundry-fix.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/foundry-local-multiturn-500
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Format changed Python files
        run: |
          python -m pip install black==26.5.1
          python -m black src/uagent/providers/llm_foundry_local.py tests/test_foundry_local_runtime_regressions.py
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/uagent/providers/llm_foundry_local.py tests/test_foundry_local_runtime_regressions.py
          git commit -m "style: format Foundry Local regression fix"
          git push origin HEAD:fix/foundry-local-multiturn-500
