name: Black debug

on:
  push:
    branches:
      - docs/active-directory-deployment-guide

jobs:
  black-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install black==26.10.0
      - run: python -m black --diff tests/test_websocket_origin_policy.py
