name: Precommit review-fix validation (Windows and Linux)
on:
  push:
    branches: [feature/admin-process-registry-20261030]
permissions:
  contents: write
concurrency:
  group: uag-p2-registry-precommit
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-process-registry-20261030
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install minimal dependencies
        run: python -m pip install -e . black ruff pytest
      - name: Install Windows ACL dependency
        if: runner.os == 'Windows'
        run: python -m pip install pywin32
      - name: Materialize uncommitted candidate blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          files = {
              "src/uagent/runtime/process_registry.py": "95a2d8a69d725d17239b18eb2465f6cba9c1ea81",
              "src/uagent/cli_entry.py": "9ddc51083aa4c31f6c79dedffcd067482e8b961d",
              "src/uagent/web.py": "d45878cc786b32a2d7de1e433ac56314fa5a2780",
              "src/uagent/gui.py": "d3197a2ff8042977af3e2231c60ebea1c8d4f2e4",
              "src/uagent/cli_impl/main.py": "959a3b32ec0a42936b42689e24bb0be6bb362832",
              "src/uagent/web_impl/init.py": "715c3db719ebde383be911b828e41d8d3a040946",
              "src/uagent/scheckgui_impl/main.py": "b6bc35d32101a858eb45cd7ec2e687d04b18a30b",
              "pyproject.toml": "37ae8342a7bdbeaae34d18b0d93428b73ea82035",
              "tests/test_process_registry.py": "758fb7eb753dca7638211955f3313c6e06eb1c63",
          }
          for path, sha in files.items():
              req = Request(
                  "https://api.github.com/repos/awaku7/agentcli/git/blobs/" + sha,
                  headers={
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Accept": "application/vnd.github+json",
                  },
              )
              with urlopen(req, timeout=30) as response:
                  data = json.load(response)
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(base64.b64decode(data["content"]))
          PY
      - name: Black format
        run: python -m black src/uagent/runtime/process_registry.py src/uagent/cli_entry.py src/uagent/web.py src/uagent/gui.py src/uagent/cli_impl/main.py src/uagent/web_impl/init.py src/uagent/scheckgui_impl/main.py tests/test_process_registry.py
      - name: Black check
        run: python -m black --check src/uagent/runtime/process_registry.py src/uagent/cli_entry.py src/uagent/web.py src/uagent/gui.py src/uagent/cli_impl/main.py src/uagent/web_impl/init.py src/uagent/scheckgui_impl/main.py tests/test_process_registry.py
      - name: Ruff check
        run: python -m ruff check src/uagent/runtime/process_registry.py src/uagent/cli_entry.py src/uagent/web.py src/uagent/gui.py src/uagent/cli_impl/main.py src/uagent/web_impl/init.py src/uagent/scheckgui_impl/main.py tests/test_process_registry.py
      - name: Registry regression
        run: python -m pytest -q tests/test_process_registry.py
      - name: Entry point syntax regression
        run: python -m compileall -q src/uagent/runtime/process_registry.py src/uagent/cli_entry.py src/uagent/web.py src/uagent/gui.py src/uagent/cli_impl/main.py src/uagent/web_impl/init.py src/uagent/scheckgui_impl/main.py tests/test_process_registry.py
  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-process-registry-20261030
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e . black ruff pytest
      - name: Restore exactly the verified candidate blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          files = {
              "src/uagent/runtime/process_registry.py": "95a2d8a69d725d17239b18eb2465f6cba9c1ea81",
              "src/uagent/cli_entry.py": "9ddc51083aa4c31f6c79dedffcd067482e8b961d",
              "src/uagent/web.py": "d45878cc786b32a2d7de1e433ac56314fa5a2780",
              "src/uagent/gui.py": "d3197a2ff8042977af3e2231c60ebea1c8d4f2e4",
              "src/uagent/cli_impl/main.py": "959a3b32ec0a42936b42689e24bb0be6bb362832",
              "src/uagent/web_impl/init.py": "715c3db719ebde383be911b828e41d8d3a040946",
              "src/uagent/scheckgui_impl/main.py": "b6bc35d32101a858eb45cd7ec2e687d04b18a30b",
              "pyproject.toml": "37ae8342a7bdbeaae34d18b0d93428b73ea82035",
              "tests/test_process_registry.py": "758fb7eb753dca7638211955f3313c6e06eb1c63",
          }
          for path, sha in files.items():
              req = Request(
                  "https://api.github.com/repos/awaku7/agentcli/git/blobs/" + sha,
                  headers={
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Accept": "application/vnd.github+json",
                  },
              )
              with urlopen(req, timeout=30) as response:
                  data = json.load(response)
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(base64.b64decode(data["content"]))
          PY
      - run: python -m black src/uagent/runtime/process_registry.py src/uagent/cli_entry.py src/uagent/web.py src/uagent/gui.py src/uagent/cli_impl/main.py src/uagent/web_impl/init.py src/uagent/scheckgui_impl/main.py tests/test_process_registry.py
      - run: python -m black --check src/uagent/runtime/process_registry.py src/uagent/cli_entry.py src/uagent/web.py src/uagent/gui.py src/uagent/cli_impl/main.py src/uagent/web_impl/init.py src/uagent/scheckgui_impl/main.py tests/test_process_registry.py
      - run: python -m ruff check src/uagent/runtime/process_registry.py src/uagent/cli_entry.py src/uagent/web.py src/uagent/gui.py src/uagent/cli_impl/main.py src/uagent/web_impl/init.py src/uagent/scheckgui_impl/main.py tests/test_process_registry.py
      - run: python -m pytest -q tests/test_process_registry.py
      - name: Commit only verified code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/uagent/runtime/process_registry.py src/uagent/cli_entry.py src/uagent/web.py src/uagent/gui.py src/uagent/cli_impl/main.py src/uagent/web_impl/init.py src/uagent/scheckgui_impl/main.py pyproject.toml tests/test_process_registry.py
          git rm .github/workflows/_candidate_registry_review_fixes.yml
          git commit -m "fix(uag): secure Windows registry ACL and register after workdir"
          git push origin HEAD:feature/admin-process-registry-20261030
