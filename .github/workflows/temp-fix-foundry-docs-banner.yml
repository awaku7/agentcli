name: Temporary Foundry Local banner and docs fixes

on:
  push:
    branches: [feature/foundry-local-openai-compat]
    paths: [.github/workflows/temp-fix-foundry-docs-banner.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch banner, tests, and docs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def edit(path, fn):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              new = fn(text)
              if new == text:
                  raise SystemExit(f'no change applied to {path}')
              p.write_text(new, encoding='utf-8')

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'anchor not found: {label}')
              return text.replace(old, new, 1)

          # Startup banner: show the required, dynamically assigned local endpoint.
          edit('src/uagent/runtime/runtime_banner.py', lambda s: replace_once(
              s,
              '    elif provider == "lmstudio":\n',
              '    elif provider == "foundry_local":\n'
              '        lines.append(\n'
              '            _("[INFO] base_url = %(base_url)s")\n'
              '            % {\n'
              '                "base_url": _normalize_url(\n'
              '                    core,\n'
              '                    env_get("UAGENT_FOUNDRY_LOCAL_BASE_URL", "(not set)"),\n'
              '                )\n'
              '            }\n'
              '        )\n'
              '    elif provider == "lmstudio":\n',
              'runtime banner foundry_local insertion',
          ))

          # Focused regression: banner must show the configured endpoint.
          p = Path('tests/test_foundry_local_provider_wiring.py')
          s = p.read_text(encoding='utf-8')
          if 'test_foundry_local_startup_banner_shows_base_url' not in s:
              s += '''\n\ndef test_foundry_local_startup_banner_shows_base_url(monkeypatch) -> None:\n    from uagent.runtime.runtime_banner import build_startup_banner\n\n    monkeypatch.setenv("UAGENT_PROVIDER", "foundry_local")\n    monkeypatch.setenv("UAGENT_FOUNDRY_LOCAL_BASE_URL", "http://localhost:5272/v1")\n    monkeypatch.setenv("UAGENT_FOUNDRY_LOCAL_DEPNAME", "phi-4-mini")\n    core = SimpleNamespace(normalize_url=lambda value: value.rstrip("/"))\n\n    banner = build_startup_banner(core=core, workdir=".", workdir_source="test")\n\n    assert "base_url = http://localhost:5272/v1" in banner\n    assert "provider = foundry_local" in banner\n'''
              p.write_text(s, encoding='utf-8')

          # README: advertise Foundry Local as a local provider.
          edit('README.md', lambda s: replace_once(
              s,
              '- **Provider freedom** — OpenAI, Anthropic, Gemini, Azure, Bedrock, Ollama, llama.cpp, Grok, DeepSeek, and more.',
              '- **Provider freedom** — OpenAI, Anthropic, Gemini, Azure, Bedrock, Ollama, llama.cpp, LM Studio, Microsoft Foundry Local, Grok, DeepSeek, and more.',
              'README provider list',
          ).replace(
              'Local models<br/>Ollama · llama.cpp · LM Studio',
              'Local models<br/>Ollama · llama.cpp · LM Studio · Foundry Local',
              1,
          ))

          # Environment docs: provider list + concrete configuration and capability routing.
          def env_en(s):
              s = replace_once(
                  s,
                  '`mimo`, `lmstudio`, `minimax`',
                  '`mimo`, `lmstudio`, `foundry_local`, `minimax`',
                  'ENVIRONMENT provider list',
              )
              anchor = '#### DeepL translation\n'
              block = '''#### Microsoft Foundry Local\n\nRequired if `UAGENT_PROVIDER=foundry_local`:\n\n- `UAGENT_FOUNDRY_LOCAL_BASE_URL` (required): loopback OpenAI-compatible endpoint, for example `http://localhost:5272/v1`.\n- `UAGENT_FOUNDRY_LOCAL_DEPNAME` (optional, default: `phi-4-mini`).\n- `UAGENT_FOUNDRY_LOCAL_API_KEY` (optional; a dummy value is used when omitted).\n\nUAG does not start Foundry Local, download/load models, or probe localhost. Start the Foundry Local service separately and provide its endpoint. Runtime model capabilities come from the bundled `llmcapa` catalog. In particular, Responses API routing is enabled only when `llmcapa` reports `supports_responses_api=true`; the current Foundry Local catalog reports `false`, so Chat Completions is used.\n\n'''
              return replace_once(s, anchor, block + anchor, 'ENVIRONMENT Foundry section')
          edit('docs/ENVIRONMENT.md', env_en)

          def env_ja(s):
              # The provider list has the same literal provider keys as English.
              if '`mimo`, `lmstudio`, `minimax`' in s:
                  s = s.replace('`mimo`, `lmstudio`, `minimax`', '`mimo`, `lmstudio`, `foundry_local`, `minimax`', 1)
              # Insert before MiniMax, which is stable in this document.
              anchor = '#### MiniMax\n'
              block = '''#### Microsoft Foundry Local\n\n`UAGENT_PROVIDER=foundry_local` の場合：\n\n- `UAGENT_FOUNDRY_LOCAL_BASE_URL`（必須）：`http://localhost:5272/v1` のようなループバック上の OpenAI 互換エンドポイント。\n- `UAGENT_FOUNDRY_LOCAL_DEPNAME`（省略可、既定: `phi-4-mini`）。\n- `UAGENT_FOUNDRY_LOCAL_API_KEY`（省略可。未指定時はダミー値を使用）。\n\nUAG 自身は Foundry Local の起動、モデルのダウンロード/ロード、localhost の探索を行いません。Foundry Local サービスは別途起動し、そのエンドポイントを指定します。モデル能力は同梱の `llmcapa` カタログで判断します。特に Responses API は `llmcapa` が `supports_responses_api=true` と報告する場合だけ使用し、現在の Foundry Local カタログは `false` のため Chat Completions を使用します。\n\n'''
              return replace_once(s, anchor, block + anchor, 'ENVIRONMENT.ja Foundry section')
          edit('docs/ENVIRONMENT.ja.md', env_ja)

          # Runtime-init docs: banner contract and llmcapa-gated Responses behavior.
          def runtime_en(s):
              s = replace_once(
                  s,
                  '`openai` / `openrouter` / `grok` / `nvidia` / `bedrock` / `ollama` / `deepseek` / `zai` / `alibaba` / `moonshot`: `base_url`',
                  '`openai` / `openrouter` / `grok` / `nvidia` / `bedrock` / `ollama` / `deepseek` / `zai` / `alibaba` / `moonshot` / `foundry_local`: `base_url`',
                  'RUNTIME_INIT banner providers',
              )
              marker = '- `core.normalize_url()` is used when available; otherwise URLs are trimmed conservatively.\n'
              addition = '- Foundry Local uses the explicitly configured loopback `UAGENT_FOUNDRY_LOCAL_BASE_URL`; UAG does not discover or start the service. Responses selection is narrowed by the selected model\'s `llmcapa` `responses_api` capability, including explicit `UAGENT_RESPONSES=1`.\n'
              return replace_once(s, marker, marker + addition, 'RUNTIME_INIT Foundry note')
          edit('src/uagent/docs/RUNTIME_INIT.md', runtime_en)

          def runtime_ja(s):
              s = replace_once(
                  s,
                  'openai / openrouter / grok / nvidia / bedrock / ollama / deepseek / zai / alibaba / moonshot: `base_url`',
                  'openai / openrouter / grok / nvidia / bedrock / ollama / deepseek / zai / alibaba / moonshot / foundry_local: `base_url`',
                  'RUNTIME_INIT.ja banner providers',
              )
              marker = '- `core.normalize_url()` が使える場合はそれを使い、使えない場合は保守的に URL を整形します。\n'
              addition = '- Foundry Local は明示指定されたループバック `UAGENT_FOUNDRY_LOCAL_BASE_URL` を使用し、UAG はサービスの探索や起動を行いません。Responses の選択は、`UAGENT_RESPONSES=1` の明示指定時も含め、選択モデルの `llmcapa` `responses_api` 能力で絞り込みます。\n'
              return replace_once(s, marker, marker + addition, 'RUNTIME_INIT.ja Foundry note')
          edit('src/uagent/docs/RUNTIME_INIT.ja.md', runtime_ja)

          # Developer docs: record the provider integration contract next to startup guidance.
          def develop_en(s):
              marker = 'The startup banner (workdir/provider/base_url/api_version/Responses mode, etc.) is generated by:\n'
              addition = 'For local OpenAI-compatible integrations such as `foundry_local`, keep transport implementation in UAG and model/API capability truth in `llmcapa`; do not add runtime model discovery or SDK-owned service startup unless explicitly required.\n\n'
              return replace_once(s, marker, addition + marker, 'DEVELOP Foundry contract')
          edit('src/uagent/docs/DEVELOP.md', develop_en)

          def develop_ja(s):
              marker = '起動時INFO（workdir/provider/base_url/api_version/Responses等）は以下で生成されます。\n'
              addition = '`foundry_local` のようなローカル OpenAI 互換統合では、transport 実装は UAG、モデル/API 能力の正本は `llmcapa` とし、明示的に必要でない限り runtime でのモデル探索や SDK によるサービス起動を追加しません。\n\n'
              return replace_once(s, marker, addition + marker, 'DEVELOP.ja Foundry contract')
          edit('src/uagent/docs/DEVELOP.ja.md', develop_ja)
          PY

          python -m pip install -e .
          python -m pip install black ruff pytest
          python -m black src/uagent/runtime/runtime_banner.py tests/test_foundry_local_provider_wiring.py
          python -m ruff check src/uagent/runtime/runtime_banner.py tests/test_foundry_local_provider_wiring.py
          pytest -q tests/test_foundry_local_provider.py tests/test_foundry_local_provider_wiring.py tests/test_provider_runtime_registry.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/temp-fix-foundry-docs-banner.yml
          git add -A
          git commit -m "docs: finish Foundry Local provider integration"
          git push origin HEAD:feature/foundry-local-openai-compat
