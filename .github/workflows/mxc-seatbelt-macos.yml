name: macOS MXC Seatbelt smoke

on:
  pull_request:
    paths:
      - ".github/workflows/mxc-seatbelt-macos.yml"
      - "src/uagent/runtime/mxc_node_helper/seatbelt_smoke.mjs"
      - "src/uagent/runtime/mxc_node_helper/package.json"
      - "src/uagent/runtime/mxc_node_helper/package-lock.json"
      - "src/uagent/runtime/mxc_node_helper/mxc_adapter.mjs"
      - "src/uagent/runtime/mxc_backend.py"
      - "src/uagent/runtime/mxc_macos_scope.py"
      - "tests/test_mxc_macos_integration.py"
      - "tests/test_mxc_backend.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seatbelt-real-host:
    # Apple Silicon only. Intel macOS Seatbelt is not in this project's support target.
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.22.0"

      - name: Install pinned MXC SDK without lifecycle scripts
        run: npm ci --prefix src/uagent/runtime/mxc_node_helper --ignore-scripts --no-audit --no-fund

      - name: Check Seatbelt smoke JavaScript syntax
        run: node --check src/uagent/runtime/mxc_node_helper/seatbelt_smoke.mjs

      - name: Execute real macOS Seatbelt smoke
        run: node src/uagent/runtime/mxc_node_helper/seatbelt_smoke.mjs

      - name: Check production adapter JavaScript syntax
        run: node --check src/uagent/runtime/mxc_node_helper/mxc_adapter.mjs

      - name: Set up Python for integrated UAG Seatbelt acceptance
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install UAG CLI, GUI, Web, A2A dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[core,providers,platform,web]" pytest
          python -m pip check

      - name: Exercise Seatbelt through production CLI GUI Web and A2A scopes
        env:
          UAGENT_RUN_MXC_MACOS_INTEGRATION: "1"
        run: |
          export UAGENT_MXC_NODE="$(command -v node)"
          export UAGENT_MXC_RUNTIME_DIR="$RUNNER_TEMP/uag-macos-mxc-runtime"
          python -m pytest -q tests/test_mxc_macos_integration.py
