name: Black fix PR 88

on:
  push:
    branches:
      - feat/opentelemetry-subagent-spans

permissions:
  contents: write

jobs:
  black-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/opentelemetry-subagent-spans
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Format with CI Black
        run: |
          python -m pip install black==26.5.1
          python -m black tests/test_observability_phase3_subagent.py
          python -m black --check tests/test_observability_phase3_subagent.py
          git diff --check

      - name: Commit Black result and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr88-black-fix.yml
          git add tests/test_observability_phase3_subagent.py
          git diff --cached --check
          git commit -m "style: format sub-agent observability test"
          git push origin HEAD:feat/opentelemetry-subagent-spans
