name: PR89 cancellation cleanup fix

on:
  push:
    branches:
      - feat/opentelemetry-mcp-http-propagation

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/opentelemetry-mcp-http-propagation
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply cancellation cleanup fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/uagent/tools/mcp/client.py')
          text = path.read_text(encoding='utf-8')
          old = '''        except MCPUnsupportedError:\n            await self._stack.aclose()\n            raise\n        except Exception as exc:\n            await self._stack.aclose()\n            raise MCPTransportError(\n'''
          new = '''        except MCPUnsupportedError:\n            await self._stack.aclose()\n            raise\n        except BaseException:\n            await self._stack.aclose()\n            raise\n        except Exception as exc:\n            await self._stack.aclose()\n            raise MCPTransportError(\n'''
          if text.count(old) != 1:
              raise SystemExit(f'client exception block mismatch: {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')

          test = Path('tests/test_observability_phase3_mcp.py')
          text = test.read_text(encoding='utf-8')
          addition = r'''


def test_stateful_setup_cancellation_closes_owned_trace_http_client(monkeypatch) -> None:
    class _OwnedClient:
        def __init__(self) -> None:
            self.closed = False

        async def aclose(self) -> None:
            self.closed = True

    owned = _OwnedClient()

    def fake_create(*args, **kwargs):
        assert kwargs.get("trusted_trace_propagation") is True
        return owned

    class _CancelledTransport:
        async def __aenter__(self):
            raise asyncio.CancelledError()

        async def __aexit__(self, exc_type, exc, tb):
            return None

    def fake_streamable_http_client(*args, **kwargs):
        assert kwargs.get("http_client") is owned
        return _CancelledTransport()

    monkeypatch.setattr("uagent.tools.mcp.client.create_mcp_http_client", fake_create)
    monkeypatch.setattr(
        "uagent.tools.mcp.client.streamable_http_client",
        fake_streamable_http_client,
    )

    from uagent.tools.mcp.client import MCPClient

    async def scenario() -> None:
        client = MCPClient(
            url="https://mcp.example/mcp",
            trusted_trace_propagation=True,
            protocol_mode="legacy",
        )
        try:
            await client.__aenter__()
        except asyncio.CancelledError:
            pass
        else:
            raise AssertionError("expected CancelledError")
        assert owned.closed is True
        assert client._http_client is None

    asyncio.run(scenario())
'''
          if 'def test_stateful_setup_cancellation_closes_owned_trace_http_client' in text:
              raise SystemExit('cancellation test already present')
          test.write_text(text.rstrip() + addition + '\n', encoding='utf-8')
          PY
      - name: Format and validate
        shell: bash
        run: |
          python -m pip install -e ".[core,providers,test]"
          python -m pip install black==26.5.1 ruff
          python -m black src/uagent/tools/mcp/client.py tests/test_observability_phase3_mcp.py
          python -m black --check src/uagent/tools/mcp/client.py tests/test_observability_phase3_mcp.py
          python -m ruff check src/uagent/tools/mcp/client.py tests/test_observability_phase3_mcp.py
          python -m pytest -q tests/test_observability_phase3_mcp.py
          git diff --check
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr89-cancel-cleanup-fix.yml
          git add src/uagent/tools/mcp/client.py tests/test_observability_phase3_mcp.py
          git diff --cached --check
          git commit -m "fix: unwind MCP client stack on cancellation"
          git push origin HEAD:feat/opentelemetry-mcp-http-propagation
