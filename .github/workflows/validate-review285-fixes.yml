name: Verify PR285 independent review fixes before commit
on:
  push:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Overlay uncommitted candidate blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$(dirname 'src/uagent/web_impl/routes_integration.py')"
          gh api 'repos/awaku7/agentcli/git/blobs/a6913bb35cd041ead8a530caf105f790d13c633c' --jq .content | base64 -d > 'src/uagent/web_impl/routes_integration.py'
          mkdir -p "$(dirname 'tests/test_integration_management_history.py')"
          gh api 'repos/awaku7/agentcli/git/blobs/be5e3523dcd4731888620031074547a7f00a5ca0' --jq .content | base64 -d > 'tests/test_integration_management_history.py'
          mkdir -p "$(dirname 'docs/UAG_ADMIN_HISTORY_INTEGRATION.md')"
          gh api 'repos/awaku7/agentcli/git/blobs/e242f27ee3552ba8cb22e4890947bbcf4b58b858' --jq .content | base64 -d > 'docs/UAG_ADMIN_HISTORY_INTEGRATION.md'
      - name: Install UAG test dependencies
        run: python -m pip install -e ".[core,providers,test,quality]"
      - name: Format with Black
        run: python -m black src/uagent/web_impl/routes_integration.py tests/test_integration_management_history.py
      - name: Black check
        run: python -m black --check --diff src tests
      - name: Ruff check
        run: python -m ruff check src tests
      - name: Management integration tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_integration_management_history.py tests/test_integration_management_api.py --disable-warnings
      - name: Upload exact verified blobs (without committing)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for file in src/uagent/web_impl/routes_integration.py tests/test_integration_management_history.py; do
            python -c 'import json,sys; p=sys.argv[1]; json.dump({"content":open(p,encoding="utf-8").read(),"encoding":"utf-8"},open("/tmp/blob.json","w",encoding="utf-8"))' "$file"
            sha=$(gh api -X POST repos/awaku7/agentcli/git/blobs --input /tmp/blob.json --jq .sha)
            echo "VERIFIED_BLOB $file $sha"
          done
