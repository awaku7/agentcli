name: Black diff temp

on:
  push:
    branches:
      - fix/memory-v2-multilingual-ranking

jobs:
  black-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install black==26.5.1
      - run: python -m black --diff src/uagent/runtime/memory_retrieval.py
