name: PR35 Apply

on:
  push:
    branches:
      - fix/session-created-at-recency

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/session-created-at-recency
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/pr35_patch.py
      - run: python -m pip install -e . pytest black
      - run: python -m black src/uagent/runtime/session_store.py tests/test_session_store.py
      - run: python -m pytest -q tests/test_session_store.py tests/test_session_resume_tool.py
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/uagent/runtime/session_store.py tests/test_session_store.py
          git commit -m "fix: preserve immutable session creation time"
          git push origin HEAD:fix/session-created-at-recency
