name: PR35 Patch Session Recency

on:
  push:
    branches:
      - fix/session-created-at-recency

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/session-created-at-recency
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch session recency semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/uagent/runtime/session_store.py")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '''                    entry_point TEXT NOT NULL,\n                    created_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP\n                );\n                CREATE TABLE IF NOT EXISTS messages (''',
                  '''                    entry_point TEXT NOT NULL,\n                    created_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP,\n                    last_used_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP\n                );\n                CREATE TABLE IF NOT EXISTS messages (''',
              ),
              (
                  '''            if "project_path" not in columns:\n                self._connection.execute(\n                    "ALTER TABLE sessions ADD COLUMN project_path TEXT"\n                )\n            message_columns = {''',
                  '''            if "project_path" not in columns:\n                self._connection.execute(\n                    "ALTER TABLE sessions ADD COLUMN project_path TEXT"\n                )\n            if "last_used_at" not in columns:\n                self._connection.execute(\n                    "ALTER TABLE sessions ADD COLUMN last_used_at TEXT"\n                )\n                self._connection.execute(\n                    "UPDATE sessions SET last_used_at = created_at WHERE last_used_at IS NULL"\n                )\n            message_columns = {''',
              ),
              (
                  '''        row = self._execute(\n            "SELECT session_id, project, project_key, project_path, entry_point, created_at FROM sessions WHERE session_id = ?",\n            (session_id,),\n        ).fetchone()''',
                  '''        row = self._execute(\n            "SELECT session_id, project, project_key, project_path, entry_point, "\n            "created_at, last_used_at FROM sessions WHERE session_id = ?",\n            (session_id,),\n        ).fetchone()''',
              ),
              (
                  '''        self._execute(\n            "UPDATE sessions SET created_at = strftime('%Y-%m-%d %H:%M:%f', 'now') WHERE session_id = ?",\n            (session_id,),\n        )''',
                  '''        self._execute(\n            "UPDATE sessions SET last_used_at = strftime('%Y-%m-%d %H:%M:%f', 'now') "\n            "WHERE session_id = ?",\n            (session_id,),\n        )''',
              ),
              (
                  '''        \"\"\"List stored sessions, newest first.\n\n        ``limit`` is applied in SQL rather than after fetching every session.''',
                  '''        \"\"\"List stored sessions, most recently used first.\n\n        ``limit`` is applied in SQL rather than after fetching every session.''',
              ),
              (
                  '''            "SELECT s.session_id, s.project, s.project_path, s.entry_point, s.created_at, "''',
                  '''            "SELECT s.session_id, s.project, s.project_path, s.entry_point, "\n            "s.created_at, s.last_used_at, "''',
              ),
              (
                  '''            + " ORDER BY s.created_at DESC, s.rowid DESC"''',
                  '''            + " ORDER BY COALESCE(s.last_used_at, s.created_at) DESC, s.rowid DESC"''',
              ),
          ]

          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit("expected session_store pattern not found")

          path.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_session_store.py")
          tests = test_path.read_text(encoding="utf-8")
          if "def test_touch_session_preserves_created_at_and_updates_last_used_at" not in tests:
              marker = "\ndef test_execute_retries_transient_database_lock(monkeypatch, tmp_path):\n"
              if marker not in tests:
                  raise SystemExit("test insertion marker not found")
              addition = '''\n\ndef test_touch_session_preserves_created_at_and_updates_last_used_at(tmp_path):\n    store = SessionStore(tmp_path / "sessions.sqlite3")\n    session = store.create_session(project="demo", entry_point="cli")\n    original_created = "2001-02-03 04:05:06"\n    original_last_used = "2001-02-03 04:05:06"\n    store._execute(\n        "UPDATE sessions SET created_at = ?, last_used_at = ? WHERE session_id = ?",\n        (original_created, original_last_used, session.session_id),\n    )\n\n    store.touch_session(session.session_id)\n\n    row = store.get_session(session.session_id)\n    assert row["created_at"] == original_created\n    assert row["last_used_at"] != original_last_used\n\n\ndef test_list_sessions_orders_by_last_used_at(tmp_path):\n    store = SessionStore(tmp_path / "sessions.sqlite3")\n    first = store.create_session(project="demo", entry_point="cli")\n    second = store.create_session(project="demo", entry_point="cli")\n    store._execute(\n        "UPDATE sessions SET created_at = ?, last_used_at = ? WHERE session_id = ?",\n        ("2026-09-22 10:00:00", "2026-09-22 10:00:00", first.session_id),\n    )\n    store._execute(\n        "UPDATE sessions SET created_at = ?, last_used_at = ? WHERE session_id = ?",\n        ("2026-09-21 10:00:00", "2026-09-22 11:00:00", second.session_id),\n    )\n\n    rows = store.list_sessions()\n\n    assert [row["session_id"] for row in rows[:2]] == [second.session_id, first.session_id]\n    assert rows[0]["created_at"] == "2026-09-21 10:00:00"\n    assert rows[0]["last_used_at"] == "2026-09-22 11:00:00"\n\n\ndef test_legacy_session_schema_migrates_last_used_at_from_created_at(tmp_path):\n    db_path = tmp_path / "legacy.sqlite3"\n    connection = sqlite3.connect(db_path)\n    connection.execute(\n        \"\"\"\n        CREATE TABLE sessions (\n            session_id TEXT PRIMARY KEY,\n            project TEXT,\n            project_key TEXT NOT NULL,\n            project_path TEXT,\n            entry_point TEXT NOT NULL,\n            created_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP\n        )\n        \"\"\"\n    )\n    connection.execute(\n        "INSERT INTO sessions(session_id, project, project_key, entry_point, created_at) "\n        "VALUES (?, ?, ?, ?, ?)",\n        ("legacy-1", "demo", "legacy-key", "cli", "2026-09-21 09:00:00"),\n    )\n    connection.commit()\n    connection.close()\n\n    store = SessionStore(db_path)\n\n    row = store.get_session("legacy-1")\n    assert row["created_at"] == "2026-09-21 09:00:00"\n    assert row["last_used_at"] == "2026-09-21 09:00:00"\n\n'''
              tests = tests.replace(marker, addition + marker, 1)
              test_path.write_text(tests, encoding="utf-8")
          PY
      - name: Format and commit if changed
        shell: bash
        run: |
          python -m pip install black==26.5.1
          python -m black src/uagent/runtime/session_store.py tests/test_session_store.py
          if git diff --quiet; then
            echo "No patch changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/uagent/runtime/session_store.py tests/test_session_store.py
          git commit -m "fix: preserve session creation time across reloads"
          git push origin HEAD:fix/session-created-at-recency
