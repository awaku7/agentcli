name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

jobs:
  changes:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      run-python: ${{ steps.scope.outputs.run-python }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect documentation-only changes
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: python
        run: |
          import os
          import subprocess

          def documentation(path):
              # Markdown used as prompts, skills, or fixtures still needs tests.
              return (
                  path in {"AGENTS.md", "tests/README.md"}
                  or ("/" not in path and path.startswith("README") and path.endswith(".md"))
                  or (path.startswith("docs/") and path.endswith(".md"))
              )

          base = os.environ.get("BASE_SHA", "")
          run_python = True
          if base and set(base) != {"0"}:
              try:
                  if os.environ["EVENT_NAME"] == "pull_request":
                      base = subprocess.check_output(
                          ["git", "merge-base", base, "HEAD"], text=True
                      ).strip()
                  paths = subprocess.check_output(
                      ["git", "diff", "--name-only", "--no-renames", "-z", base, "HEAD"]
                  ).decode("utf-8").split("\0")
                  paths = [path for path in paths if path]
                  run_python = not paths or not all(map(documentation, paths))
              except (subprocess.CalledProcessError, UnicodeDecodeError):
                  # Unknown scope must never silently bypass Python checks.
                  pass
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run-python={str(run_python).lower()}\n")
          print("Run Python checks:", run_python)

  quality:
    needs: changes
    if: needs.changes.outputs.run-python == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[core,providers,test]"
          python -m pip install black ruff

      - name: Ruff
        run: python -m ruff check src tests

      - name: Black
        run: python -m black --check src tests

      - name: I18N catalog status
        run: python scripts/tool_json_i18n_batch.py status

      - name: Audit host and tool I18N structure
        run: python scripts/i18n_structure_audit.py --strict --report outputs/i18n/structure_audit.json

      - name: Validate tool catalogs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          catalogs=(src/uagent/tools/*_tool.json)
          test "${#catalogs[@]}" -gt 0
          for catalog in "${catalogs[@]}"; do
            python scripts/i18n_validate.py "$catalog"
          done

  full-tests:
    needs: changes
    if: needs.changes.outputs.run-python == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[core,providers,test]"

      - name: Full test suite
        env:
          PYTHONPATH: src
        run: python -m pytest -q . --durations=30

  compatibility-tests:
    needs: changes
    if: needs.changes.outputs.run-python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[core,providers,test]"

      - name: Compile all Python sources
        run: python -m compileall -q src tests

      - name: Runtime compatibility contracts
        env:
          PYTHONPATH: src
        run: |
          # Keep cross-version coverage focused on runtime boundaries most
          # likely to expose Python/SDK compatibility differences. The full
          # suite covers 3.12 for non-documentation changes and nightly on all four.
          python -m pytest -q \
            tests/test_session_portability.py \
            tests/test_web_session_portability.py \
            tests/test_capability_resolver.py \
            tests/test_context_recovery_integration.py \
            tests/test_legacy_claude_round.py \
            tests/test_legacy_deepseek_round.py \
            tests/test_legacy_gateway_round.py \
            tests/test_legacy_gemini_round.py \
            tests/test_legacy_openai_round.py \
            tests/test_legacy_provider_dispatch.py \
            tests/test_legacy_round_registry.py \
            tests/test_legacy_zai_round.py \
            tests/test_openai_compatible_runtime.py \
            tests/test_provider_round_dispatcher.py \
            tests/test_responses_runtime.py \
            tests/test_retry_coordinator.py \
            tests/test_round_contracts.py \
            tests/test_round_integration_regressions.py \
            tests/test_round_orchestrator.py \
            tests/test_stream_renderer.py \
            tests/test_tool_discovery.py

  nightly-full-tests:
    # Scheduled/manual runs preserve the former four-version full-suite
    # safety net without charging every pull request for it.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[core,providers,test]"

      - name: Full test suite
        env:
          PYTHONPATH: src
        run: python -m pytest -q . --durations=30

  apply-runtime-capability-patch:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/llmcapa-capability-routing'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply capability-driven runtime patch
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/uagent/llm_round_helpers.py")
          text = path.read_text(encoding="utf-8")
          start = text.index("def _resolve_round_runtime_flags(\n")
          end = text.index("\n\ndef _translate_assistant_if_needed(", start)
          replacement = '''def _resolve_round_runtime_flags(
              *,
              tr_cfg: Any,
              core: Any,
              provider: str = "",
              depname: str = "",
              capability_resolver: CapabilityResolverPort | None = None,
          ) -> Any:
              lmstudio_transport = (
                  (env_get("UAGENT_LMSTUDIO_TRANSPORT", "") or "").lower().strip()
              )
              if provider == "lmstudio" and lmstudio_transport in {
                  "sdk",
                  "chat",
                  "chat_completions",
              }:
                  # The LM Studio Python SDK exposes native chat prediction, not the
                  # OpenAI Responses client surface.
                  responses_env = "0"
              elif provider == "lmstudio" and lmstudio_transport in {"responses", "response"}:
                  responses_env = "1"
              else:
                  responses_env = (env_get("UAGENT_RESPONSES", "") or "").lower().strip()

              # Meta Model API exposes the Responses API as its supported agent surface.
              # Do not allow a global Chat Completions override to route Meta elsewhere.
              if provider == "meta":
                  responses_env = "1"

              from .runtime.capability_resolver import responses_api_explicit_enabled

              if responses_env in ("1", "true"):
                  if provider == "lmstudio":
                      from .providers.llm_lmstudio import responses_endpoint_available

                      use_responses_api = responses_endpoint_available(core)
                  else:
                      use_responses_api = responses_api_explicit_enabled(
                          provider,
                          depname,
                          resolver=capability_resolver,
                      )
              elif responses_env in ("0", "false", "no", "off"):
                  use_responses_api = False
              else:
                  # LM Studio defaults to Responses, but only when the running server
                  # actually exposes the endpoint (added in LM Studio v0.3.29).
                  if provider == "lmstudio":
                      from .providers.llm_lmstudio import responses_endpoint_available

                      use_responses_api = responses_endpoint_available(core)
                  else:
                      # Auto-enable when provider/model can use Responses API.
                      use_responses_api = _responses_api_auto_enabled(
                          provider=provider,
                          depname=depname,
                          capability_resolver=capability_resolver,
                      )

              stream_responses = _env_default_true("UAGENT_STREAMING", default=True)
              from .runtime.capability_resolver import streaming_requested_enabled

              stream_responses = streaming_requested_enabled(
                  provider,
                  depname,
                  requested=stream_responses,
                  transport="responses" if use_responses_api else "chat_completions",
                  resolver=capability_resolver,
              )

              # If translation is enabled, disable streaming to avoid mismatched partial outputs.
              # (We translate per-call, not per-delta.)
              if tr_cfg is not None and (
                  (tr_cfg.to_llm or "").strip() or (tr_cfg.from_llm or "").strip()
              ):
                  stream_responses = False

              # If using Responses API and reasoning=auto, disable streaming so we can retry once
              # (and avoid mixed partial outputs that cannot be "taken back").
              if use_responses_api and stream_responses:
                  _r0 = (env_get("UAGENT_REASONING") or "").strip().lower()
                  if _r0 == "auto":
                      stream_responses = False
                      try:
                          core.set_status(True, "LLM:auto")
                      except Exception:
                          pass

              return use_responses_api, stream_responses
          '''
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")

          test_path = Path("tests/test_round_runtime_flags.py")
          tests = test_path.read_text(encoding="utf-8")
          marker = "def test_streaming_false_capability_disables_streaming_for_any_provider("
          if marker not in tests:
              tests = tests.rstrip() + '''


          def test_streaming_false_capability_disables_streaming_for_any_provider(
              monkeypatch,
          ) -> None:
              monkeypatch.setenv("UAGENT_RESPONSES", "0")
              monkeypatch.setenv("UAGENT_STREAMING", "1")
              resolver = CapabilityResolver(
                  feature_lookup=lambda feature, *_: False if feature == "streaming" else None
              )

              assert _resolve_round_runtime_flags(
                  tr_cfg=None,
                  core=_core(),
                  provider="openai",
                  depname="example-model",
                  capability_resolver=resolver,
              ) == (False, False)


          def test_unknown_streaming_capability_preserves_requested_setting(monkeypatch) -> None:
              monkeypatch.setenv("UAGENT_RESPONSES", "0")
              monkeypatch.setenv("UAGENT_STREAMING", "1")

              assert _resolve_round_runtime_flags(
                  tr_cfg=None,
                  core=_core(),
                  provider="openai",
                  depname="unknown-model",
                  capability_resolver=_FailingResolver(),
              ) == (False, True)
          '''
              test_path.write_text(tests, encoding="utf-8")

      - name: Format and verify focused tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[core,providers,test]"
          python -m pip install black ruff
          python -m black src/uagent/llm_round_helpers.py tests/test_round_runtime_flags.py
          python -m ruff check src/uagent/llm_round_helpers.py tests/test_round_runtime_flags.py
          python -m pytest -q tests/test_round_runtime_flags.py tests/test_llmcapa_runtime_routing.py tests/test_capability_resolver.py

      - name: Commit runtime patch
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/uagent/llm_round_helpers.py tests/test_round_runtime_flags.py
          if git diff --cached --quiet; then
            echo "Runtime patch already applied."
            exit 0
          fi
          git commit -m "fix: apply capability gates to round runtime"
          git push origin "HEAD:${BRANCH}"
