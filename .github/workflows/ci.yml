name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

jobs:
  readme-parity:
    # Documentation-only PRs still need this check, even when Python CI is skipped.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check localized README structure and operational commands
        shell: bash
        run: |
          set -euo pipefail
          expected_h2="$(grep -c '^## ' README.md)"
          expected_h3="$(grep -c '^### ' README.md)"
          canonical_sections="$(grep '^<!-- README-SYNC:' README.md)"
          shopt -s nullglob
          locales=(docs/README.*.md)
          test "${#locales[@]}" -eq 38  # 37 locales plus translation index
          for file in "${locales[@]}"; do
            [[ "$file" == "docs/README.translations.md" ]] && continue
            if [[ "$(grep -c '^## ' "$file")" != "$expected_h2" ||
                  "$(grep -c '^### ' "$file")" != "$expected_h3" ]]; then
              echo "::error file=$file::README section structure differs from English"
              exit 1
            fi
            if [[ "$(grep '^<!-- README-SYNC:' "$file")" != "$canonical_sections" ]]; then
              echo "::error file=$file::README semantic sections are out of sync with English"
              exit 1
            fi
            for invariant in \
              'python -m pip install --upgrade uag' \
              'python -m pip install "uag[core,providers,tools]"' \
              'python -m pip install "uag[platform]"' \
              'python -m pip install "uag[web]" fastapi uvicorn' \
              'UAGENT_PROVIDER' 'tool_catalog' 'tool_load' \
              'artifact_read' 'human_ask' ':auto' 'F12' 'SQLite' \
              'README.translations.md' \
              'SANDBOX_MXC.md' 'REMOTE_MXC_DEFAULT.md' \
              'ENTERPRISE_POLICY.md'; do
              if ! grep -Fq -- "$invariant" "$file"; then
                echo "::error file=$file::Missing README invariant: $invariant"
                exit 1
              fi
            done
            if grep -Fq 'pip install PySide6' "$file"; then
              echo "::error file=$file::Stale platform-specific installation command"
              exit 1
            fi
          done

  changes:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      run-python: ${{ steps.scope.outputs.run-python }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect documentation-only changes
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: python
        run: |
          import os
          import subprocess

          def documentation(path):
              # Markdown used as prompts, skills, or fixtures still needs tests.
              return (
                  path in {"AGENTS.md", "tests/README.md"}
                  or ("/" not in path and path.startswith("README") and path.endswith(".md"))
                  or (path.startswith("docs/") and path.endswith(".md"))
                  or (path.startswith("src/uagent/docs/") and path.endswith(".md"))
              )

          base = os.environ.get("BASE_SHA", "")
          run_python = True
          if base and set(base) != {"0"}:
              try:
                  if os.environ["EVENT_NAME"] == "pull_request":
                      base = subprocess.check_output(
                          ["git", "merge-base", base, "HEAD"], text=True
                      ).strip()
                  paths = subprocess.check_output(
                      ["git", "diff", "--name-only", "--no-renames", "-z", base, "HEAD"]
                  ).decode("utf-8").split("\0")
                  paths = [path for path in paths if path]
                  run_python = not paths or not all(map(documentation, paths))
              except (subprocess.CalledProcessError, UnicodeDecodeError):
                  # Unknown scope must never silently bypass Python checks.
                  pass
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run-python={str(run_python).lower()}\n")
          print("Run Python checks:", run_python)

  quality:
    needs: changes
    if: needs.changes.outputs.run-python == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[core,providers,test,quality]"

      - name: Ruff
        run: python -m ruff check src tests

      - name: Black
        run: python -m black --check --diff src tests

      - name: I18N catalog status
        run: python scripts/tool_json_i18n_batch.py status --show-missing-keys --show-same-as-english-keys --show-same-as-english-units --require-complete

      - name: Audit host and tool I18N structure
        run: |
          python scripts/i18n_structure_audit.py --strict --report outputs/i18n/structure_audit.json
          python scripts/i18n_structure_audit.py --strict --tools-root src/uagent/tools_rust

      - name: Validate tool JSON catalog shape
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          catalogs=(src/uagent/tools/*.json src/uagent/tools_rust/*.json)
          test "${#catalogs[@]}" -gt 0
          for catalog in "${catalogs[@]}"; do
            python scripts/i18n_validate.py "$catalog"
          done

  full-tests:
    needs: changes
    # Keep the complete suite on pushes to main; scheduled/manual runs use the
    # all-version matrix below. Pull requests run changed-area tests instead.
    if: needs.changes.outputs.run-python == 'true' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[core,providers,test,quality]"

      - name: Full test suite
        env:
          PYTHONPATH: src
        run: python -m pytest -q . --durations=30

  pull-request-tests:
    needs: changes
    if: needs.changes.outputs.run-python == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[core,providers,test,quality]"

      - name: Run changed-area tests (full-suite fallback for unmapped changes)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path

          base = subprocess.check_output(
              ["git", "merge-base", "HEAD", os.environ["BASE_SHA"]], text=True
          ).strip()
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "--no-renames", base, "HEAD"],
              text=True,
          ).splitlines()

          # Keep this map explicit and conservative. If production code changes
          # without a reviewed mapping, run the full suite rather than silently
          # skipping tests.
          source_tests = {
              "src/uagent/runtime/memory_scope.py": [
                  "tests/test_memory_scope_metadata.py",
                  "tests/test_memory_projection.py",
                  "tests/test_memory_v2_acceptance.py",
                  "tests/test_memory_v3_projection.py",
                  "tests/test_memory_v3_web_api.py",
              ],
              "src/uagent/web_impl/routes_api.py": [
                  "tests/test_memory_v3_web_api.py",
                  "tests/test_web_authorization_hardening.py",
                  "tests/test_web_memory_store_lifetime.py",
                  "tests/test_web_room_lifecycle.py",
                  "tests/test_web_session_portability.py",
                  "tests/test_observability_phase4_trace_query_final_revalidation.py",
                  "tests/test_observability_phase4_trace_query_projection.py",
                  "tests/test_observability_phase4_trace_query_route.py",
              ],
          }

          selected = set()
          fallback_reason = None

          def documentation(path):
              return (
                  path in {"AGENTS.md", "tests/README.md"}
                  or ("/" not in path and path.startswith("README") and path.endswith(".md"))
                  or (path.startswith("docs/") and path.endswith(".md"))
                  or (path.startswith("src/uagent/docs/") and path.endswith(".md"))
              )

          for path in changed:
              if documentation(path):
                  continue
              # A CI workflow change is exercised by GitHub Actions itself.
              # If it is the only non-documentation change, the empty selection
              # below still falls back to the full suite.
              if path == ".github/workflows/ci.yml":
                  continue
              if path.startswith("tests/test_") and path.endswith(".py"):
                  if Path(path).is_file():
                      selected.add(path)
                  else:
                      fallback_reason = f"changed test is absent from checkout: {path}"
                      break
                  continue
              if path.startswith("src/uagent/") and path.endswith(".py"):
                  mapped = source_tests.get(path)
                  if mapped and all(Path(test).is_file() for test in mapped):
                      selected.update(mapped)
                  else:
                      fallback_reason = f"no reviewed test mapping for source file: {path}"
                      break
                  continue
              fallback_reason = f"unclassified changed path: {path}"
              break

          if not selected and fallback_reason is None:
              fallback_reason = "no changed-area tests were selected"

          if fallback_reason:
              print(f"Running full suite: {fallback_reason}", flush=True)
              command = [sys.executable, "-m", "pytest", "-q", ".", "--durations=30"]
          else:
              tests = sorted(selected)
              print("Running changed-area tests:", *tests, sep="\n  ", flush=True)
              command = [sys.executable, "-m", "pytest", "-q", *tests, "--durations=30"]

          raise SystemExit(subprocess.call(command))
          PY

  mxc-linux-integration:
    needs: changes
    if: needs.changes.outputs.run-python == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.21.0"

      - name: Export trusted Node.js path
        shell: bash
        run: echo "UAGENT_MXC_NODE=$(command -v node)" >> "$GITHUB_ENV"

      - name: Install Linux isolation prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            apparmor bubblewrap iptables iproute2 slirp4netns util-linux

      - name: Allow Bubblewrap user namespaces under AppArmor
        shell: bash
        run: |
          # Ubuntu restricts unprivileged user namespaces by default. Permit
          # Bubblewrap only; do not weaken the host-wide AppArmor sysctl.
          sudo tee /etc/apparmor.d/bwrap >/dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>
          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/bwrap

      - name: Start delegated systemd user manager
        shell: bash
        run: |
          uid="$(id -u)"
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@${uid}.service"
          for attempt in $(seq 1 30); do
            if [[ -S "/run/user/${uid}/bus" ]]; then
              break
            fi
            sleep 1
          done
          test -S "/run/user/${uid}/bus"
          systemctl --user show-environment

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[core,providers,test]"

      - name: Provision the pinned MXC SDK
        shell: bash
        env:
          MXC_RUNTIME: ${{ runner.temp }}/uagent-mxc-runtime
        run: |
          mkdir -p "$MXC_RUNTIME"
          cp src/uagent/runtime/mxc_node_helper/mxc_adapter.mjs \
            src/uagent/runtime/mxc_node_helper/package.json \
            src/uagent/runtime/mxc_node_helper/package-lock.json "$MXC_RUNTIME/"
          chmod 700 "$MXC_RUNTIME"
          npm ci --prefix "$MXC_RUNTIME" --ignore-scripts --no-audit --no-fund

      - name: Verify Linux MXC isolation and resource controls
        env:
          PYTHONPATH: src
          UAGENT_MXC_RUNTIME_DIR: ${{ runner.temp }}/uagent-mxc-runtime
          UAGENT_RUN_MXC_LINUX_INTEGRATION: "1"
        run: python -m pytest -q tests/test_mxc_linux_scope.py tests/test_mxc_linux_integration.py

  macos-platform-smoke:
    needs: changes
    if: needs.changes.outputs.run-python == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CLI, Desktop, and Web dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[core,providers,platform,web]" pytest fastapi uvicorn
          python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q src

      - name: Smoke test macOS CLI, Desktop, and Web imports
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: |
          for module in uagent.cli_entry uagent.cli uagent.gui uagent.web uagent.scheckgui_impl.main; do
            UAG_IMPORT_MODULE="$module" python - <<'PY'
          import importlib
          import os
          import platform
          import sys
          import traceback

          name = os.environ["UAG_IMPORT_MODULE"]
          print(f"Checking {name} on {platform.platform()} ({platform.machine()})", file=sys.__stdout__, flush=True)
          try:
              importlib.import_module(name)
          except BaseException:
              traceback.print_exc(file=sys.__stderr__)
              raise
          print(f"Imported {name}", file=sys.__stdout__, flush=True)
          PY
          done
          uag session --help

      - name: Verify platform and session regressions
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: |
          # macOS MXC is currently unsupported: the trusted host-path override
          # test assumes a Windows/Linux runtime root. Keep its existing coverage
          # on those hosts while checking all other MXC contracts on macOS.
          python -m pytest -q \
            tests/test_session_portability.py \
            tests/test_web_session_portability.py \
            tests/test_mxc_backend.py \
            -k 'not test_mxc_host_paths_accept_only_pre_dotenv_overrides'

  compatibility-tests:
    needs: changes
    if: needs.changes.outputs.run-python == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[core,providers,test,quality]"

      - name: Compile all Python sources
        run: python -m compileall -q src tests

      - name: Runtime compatibility contracts
        env:
          PYTHONPATH: src
        run: |
          # Keep cross-version coverage focused on runtime boundaries most
          # likely to expose Python/SDK compatibility differences. The full
          # suite covers 3.12 for non-documentation changes and nightly on all four.
          python -m pytest -q \
            tests/test_session_portability.py \
            tests/test_web_session_portability.py \
            tests/test_capability_resolver.py \
            tests/test_context_recovery_integration.py \
            tests/test_legacy_claude_round.py \
            tests/test_legacy_deepseek_round.py \
            tests/test_legacy_gateway_round.py \
            tests/test_legacy_gemini_round.py \
            tests/test_legacy_openai_round.py \
            tests/test_legacy_provider_dispatch.py \
            tests/test_legacy_round_registry.py \
            tests/test_legacy_zai_round.py \
            tests/test_openai_compatible_runtime.py \
            tests/test_provider_round_dispatcher.py \
            tests/test_responses_runtime.py \
            tests/test_retry_coordinator.py \
            tests/test_round_contracts.py \
            tests/test_round_integration_regressions.py \
            tests/test_round_orchestrator.py \
            tests/test_stream_renderer.py \
            tests/test_tool_discovery.py \
            tests/test_util_cmd_auto.py \
            tests/test_decision_provider_typesafe.py \
            tests/test_decision_provider_openrouter.py \
            tests/test_decision_provider_laya.py \
            tests/test_auto_pilot_observability.py

  nightly-full-tests:
    # Scheduled/manual runs preserve the former four-version full-suite
    # safety net without charging every pull request for it.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[core,providers,test,quality]"

      - name: Full test suite
        env:
          PYTHONPATH: src
        run: python -m pytest -q . --durations=30

  web-socket-lifecycle:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.21.0"
      - name: Test WebSocket reconnection and bundled UI
        run: node --test frontend/tests/socket-lifecycle.test.mjs
