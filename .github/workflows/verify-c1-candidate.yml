name: Verify C1 candidate
on:
  push:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Overlay candidate Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$(dirname 'src/uagent/runtime/project_membership_mutation.py')"
          gh api 'repos/awaku7/agentcli/git/blobs/202981a91f8bbd5296dad88580a7059f7ecaf5e9' --jq .content | base64 -d > 'src/uagent/runtime/project_membership_mutation.py'
          mkdir -p "$(dirname 'src/uagent/runtime/memory_store.py')"
          gh api 'repos/awaku7/agentcli/git/blobs/5a2002720acfbabdece7a2158a6f660649279980' --jq .content | base64 -d > 'src/uagent/runtime/memory_store.py'
          mkdir -p "$(dirname 'src/uagent/web_impl/routes_integration.py')"
          gh api 'repos/awaku7/agentcli/git/blobs/fb9c93933607fce449a9d03cd2695e34874ae7cf' --jq .content | base64 -d > 'src/uagent/web_impl/routes_integration.py'
          mkdir -p "$(dirname 'src/uagent/web_impl/routes_integration_write.py')"
          gh api 'repos/awaku7/agentcli/git/blobs/afddda9f15005878abc089b3ae932fe00bf595b2' --jq .content | base64 -d > 'src/uagent/web_impl/routes_integration_write.py'
          mkdir -p "$(dirname 'tests/test_integration_management_write.py')"
          gh api 'repos/awaku7/agentcli/git/blobs/5e9c459d98f4fa6b99df7182aad6a9953a5f0600' --jq .content | base64 -d > 'tests/test_integration_management_write.py'
          mkdir -p "$(dirname 'docs/UAG_ADMIN_MEMBERSHIP_WRITE_CONTRACT.md')"
          gh api 'repos/awaku7/agentcli/git/blobs/75c70948d1216465a7524cd753b2ad6cbb940830' --jq .content | base64 -d > 'docs/UAG_ADMIN_MEMBERSHIP_WRITE_CONTRACT.md'
      - name: Install test and quality dependencies
        run: python -m pip install -e ".[core,providers,test,quality]"
      - name: Black format changed Python files
        run: python -m black src/uagent/runtime/project_membership_mutation.py src/uagent/runtime/memory_store.py src/uagent/web_impl/routes_integration.py src/uagent/web_impl/routes_integration_write.py tests/test_integration_management_write.py
      - name: Check Black
        run: python -m black --check --diff src tests
      - name: Check Ruff
        run: python -m ruff check src tests
      - name: Project membership and management API tests
        run: python -m pytest -q tests/test_integration_management_write.py tests/test_project_membership_mutation.py tests/test_project_access.py tests/test_integration_management_history.py tests/test_integration_management_api.py --tb=short
      - name: Publish verified source blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for file in src/uagent/runtime/project_membership_mutation.py src/uagent/runtime/memory_store.py src/uagent/web_impl/routes_integration.py src/uagent/web_impl/routes_integration_write.py tests/test_integration_management_write.py; do
            python -c 'import json,sys; p=sys.argv[1]; json.dump({"content":open(p,encoding="utf-8").read(),"encoding":"utf-8"},open("/tmp/c1-verified.json","w",encoding="utf-8"))' "$file"
            sha=$(gh api -X POST repos/awaku7/agentcli/git/blobs --input /tmp/c1-verified.json --jq .sha)
            echo "VERIFIED_BLOB $file $sha"
          done
