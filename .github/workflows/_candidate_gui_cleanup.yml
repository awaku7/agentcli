name: Verify direct GUI cleanup before commit
on:
  push:
    branches: [feature/admin-process-registry-20261030]
permissions:
  contents: write
concurrency:
  group: uag-gui-cleanup-validation
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-process-registry-20261030
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e . black ruff pytest
      - name: Materialize candidate blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, json, os
          from pathlib import Path
          from urllib.request import Request, urlopen
          req=Request(
              "https://api.github.com/repos/awaku7/agentcli/git/blobs/6850c4ff2aa1105ce87d51d3f5d28bc5e5ad356b",
              headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"},
          )
          with urlopen(req,timeout=30) as response:
              data=json.load(response)
          Path("src/uagent/scheckgui.py").write_bytes(base64.b64decode(data["content"]))
          PY
      - run: python -m black src/uagent/scheckgui.py
      - run: python -m black --check src/uagent/scheckgui.py
      - run: python -m ruff check src/uagent/scheckgui.py
      - run: python -m pytest -q tests/test_process_registry.py
      - run: python -m compileall -q src/uagent/scheckgui.py
      - name: Commit tested GUI fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/uagent/scheckgui.py
          git rm .github/workflows/_candidate_gui_cleanup.yml
          git commit -m "fix(uag): cleanup process registry on direct GUI entrypoint"
          git push origin HEAD:feature/admin-process-registry-20261030
