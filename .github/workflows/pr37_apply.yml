name: PR37 Apply

on:
  push:
    branches:
      - fix/consecutive-tool-round-guard

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/consecutive-tool-round-guard
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/pr37_patch.py
      - run: python -m pip install -e . pytest black
      - run: python -m black src/uagent/uagent_llm.py tests/test_general_tool_loop.py
      - run: python -m pytest -q tests/test_general_tool_loop.py
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/uagent/uagent_llm.py tests/test_general_tool_loop.py
          git commit -m "fix: count consecutive tool usage by round"
          git push origin HEAD:fix/consecutive-tool-round-guard
