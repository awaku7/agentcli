name: Verify CLI lifecycle review fixes
on:
  push:
    branches: [feature/admin-process-registry-20261030]
permissions:
  contents: write
concurrency:
  group: uag-cli-tracking-p2
  cancel-in-progress: true
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-process-registry-20261030
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e . pytest black ruff
      - name: Materialize uncommitted source blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          files = {
              "src/uagent/runtime/process_registry.py": "9c97b90fb66128426195f4ccde3c6c28d1b2fbad",
              "src/uagent/cli_startup.py": "aac3813f67ea1cc9f54738a6d104bd3f2826bebf",
              "src/uagent/cli_impl/main.py": "bf6d29405fe16afd2315c8d7a3d7b2200c34f006",
              "src/uagent/cli.py": "55995c019958b65bbfad026db40db17589a2a86e",
              "src/uagent/cli_entry.py": "3ab593a5a15b9c34dbadbe2fbaf48cb20bf439f8",
              "tests/test_process_registry.py": "56b47ba4b6d7706618dd1c56e24c82b8e0cecd98",
          }
          for path, sha in files.items():
              request = Request(
                  "https://api.github.com/repos/awaku7/agentcli/git/blobs/" + sha,
                  headers={
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Accept": "application/vnd.github+json",
                  },
              )
              with urlopen(request, timeout=30) as response:
                  data = json.load(response)
              Path(path).write_bytes(base64.b64decode(data["content"]))
          PY
      - run: python -m black src/uagent/runtime/process_registry.py src/uagent/cli_startup.py src/uagent/cli_impl/main.py src/uagent/cli.py src/uagent/cli_entry.py tests/test_process_registry.py
      - run: python -m black --check src/uagent/runtime/process_registry.py src/uagent/cli_startup.py src/uagent/cli_impl/main.py src/uagent/cli.py src/uagent/cli_entry.py tests/test_process_registry.py
      - run: python -m ruff check src/uagent/runtime/process_registry.py src/uagent/cli_startup.py src/uagent/cli_impl/main.py src/uagent/cli.py src/uagent/cli_entry.py tests/test_process_registry.py
      - run: python -m pytest -q tests/test_process_registry.py
      - run: python -m compileall -q src/uagent/runtime/process_registry.py src/uagent/cli_startup.py src/uagent/cli_impl/main.py src/uagent/cli.py src/uagent/cli_entry.py tests/test_process_registry.py
  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-process-registry-20261030
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e . pytest black ruff
      - name: Restore verified candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          files = {
              "src/uagent/runtime/process_registry.py": "9c97b90fb66128426195f4ccde3c6c28d1b2fbad",
              "src/uagent/cli_startup.py": "aac3813f67ea1cc9f54738a6d104bd3f2826bebf",
              "src/uagent/cli_impl/main.py": "bf6d29405fe16afd2315c8d7a3d7b2200c34f006",
              "src/uagent/cli.py": "55995c019958b65bbfad026db40db17589a2a86e",
              "src/uagent/cli_entry.py": "3ab593a5a15b9c34dbadbe2fbaf48cb20bf439f8",
              "tests/test_process_registry.py": "56b47ba4b6d7706618dd1c56e24c82b8e0cecd98",
          }
          for path, sha in files.items():
              request = Request(
                  "https://api.github.com/repos/awaku7/agentcli/git/blobs/" + sha,
                  headers={
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Accept": "application/vnd.github+json",
                  },
              )
              with urlopen(request, timeout=30) as response:
                  data = json.load(response)
              Path(path).write_bytes(base64.b64decode(data["content"]))
          PY
      - run: python -m black src/uagent/runtime/process_registry.py src/uagent/cli_startup.py src/uagent/cli_impl/main.py src/uagent/cli.py src/uagent/cli_entry.py tests/test_process_registry.py
      - run: python -m black --check src/uagent/runtime/process_registry.py src/uagent/cli_startup.py src/uagent/cli_impl/main.py src/uagent/cli.py src/uagent/cli_entry.py tests/test_process_registry.py
      - run: python -m ruff check src/uagent/runtime/process_registry.py src/uagent/cli_startup.py src/uagent/cli_impl/main.py src/uagent/cli.py src/uagent/cli_entry.py tests/test_process_registry.py
      - run: python -m pytest -q tests/test_process_registry.py
      - name: Commit tested sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/uagent/runtime/process_registry.py src/uagent/cli_startup.py src/uagent/cli_impl/main.py src/uagent/cli.py src/uagent/cli_entry.py tests/test_process_registry.py
          git rm .github/workflows/_candidate_cli_registry_review.yml
          git commit -m "fix(uag): track CLI before startup turns and cleanup all launch paths"
          git push origin HEAD:feature/admin-process-registry-20261030
