name: PR90 MCP i18n fix v4

on:
  push:
    branches:
      - feat/opentelemetry-mcp-config-optin

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/opentelemetry-mcp-config-optin
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Patch source and localized catalog deterministically
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          py_path = Path('src/uagent/tools/mcp_servers_tool.py')
          text = py_path.read_text(encoding='utf-8')
          replacements = [
              ('f"WARNING: mcp_servers[{idx}].trusted_trace_propagation must be boolean."', '''_(
                    "warn.trusted_trace_boolean",
                    default="WARNING: mcp_servers[{idx}].trusted_trace_propagation must be boolean.",
                ).format(idx=idx)''', 1),
              ('f"WARNING: mcp_servers[{idx}].trusted_trace_propagation is ignored for non-HTTP transports."', '''_(
                    "warn.trusted_trace_non_http",
                    default=(
                        "WARNING: mcp_servers[{idx}].trusted_trace_propagation is ignored "
                        "for non-HTTP transports."
                    ),
                ).format(idx=idx)''', 2),
              ('f"ERROR: mcp_servers[{idx}].trusted_trace_propagation must be boolean"', '''_(
                    "err.trusted_trace_boolean_indexed",
                    default="ERROR: mcp_servers[{idx}].trusted_trace_propagation must be boolean",
                ).format(idx=idx)''', 1),
              ('"error": "trusted_trace_propagation must be boolean",', '''"error": _(
                    "err.trusted_trace_boolean",
                    default="trusted_trace_propagation must be boolean",
                ),''', 2),
          ]
          for old, new, expected in replacements:
              actual = text.count(old)
              assert actual == expected, (old, actual, expected)
              text = text.replace(old, new)
          py_path.write_text(text, encoding='utf-8', newline='\n')

          phrases = {
              'ja': ('は真偽値である必要があります', 'は非HTTPトランスポートでは無視されます'),
              'es': ('debe ser un valor booleano', 'se ignora para transportes que no son HTTP'),
              'fr': ('doit être une valeur booléenne', 'est ignoré pour les transports non HTTP'),
              'ko': ('값은 불리언이어야 합니다', '설정은 HTTP가 아닌 전송 방식에서는 무시됩니다'),
              'de': ('muss ein boolescher Wert sein', 'wird bei Nicht-HTTP-Transporten ignoriert'),
              'it': ('deve essere un valore booleano', 'viene ignorato per i trasporti non HTTP'),
              'ru': ('должно иметь логическое значение', 'игнорируется для транспортов, отличных от HTTP'),
              'pt_BR': ('deve ser um valor booleano', 'é ignorado para transportes que não são HTTP'),
              'pt': ('deve ser um valor booleano', 'é ignorado para transportes que não são HTTP'),
              'id': ('harus berupa nilai boolean', 'diabaikan untuk transport non-HTTP'),
              'vi': ('phải là giá trị boolean', 'bị bỏ qua đối với transport không phải HTTP'),
              'pl': ('musi być wartością logiczną', 'jest ignorowane dla transportów innych niż HTTP'),
              'hi': ('बूलियन मान होना चाहिए', 'गैर-HTTP ट्रांसपोर्ट के लिए अनदेखा किया जाता है'),
              'ar': ('يجب أن تكون قيمة منطقية', 'يتم تجاهله في وسائل النقل غير HTTP'),
              'sv': ('måste vara ett booleskt värde', 'ignoreras för transport som inte använder HTTP'),
              'sw': ('lazima iwe thamani ya boolean', 'hupuuzwa kwa transport zisizo za HTTP'),
              'nb': ('må være en boolsk verdi', 'ignoreres for transport som ikke bruker HTTP'),
              'nl': ('moet een booleaanse waarde zijn', 'wordt genegeerd voor niet-HTTP-transports'),
              'fi': ('on oltava totuusarvo', 'ohitetaan muissa kuin HTTP-siirtotavoissa'),
              'cs': ('musí být logická hodnota', 'je ignorováno pro transporty jiné než HTTP'),
              'uk': ('має бути логічним значенням', 'ігнорується для транспортів, відмінних від HTTP'),
              'tr': ('boolean bir değer olmalıdır', 'HTTP dışı taşımalarda yok sayılır'),
              'th': ('ต้องเป็นค่าบูลีน', 'จะถูกละเว้นสำหรับการขนส่งที่ไม่ใช่ HTTP'),
              'zh_CN': ('必须是布尔值', '在非 HTTP 传输中会被忽略'),
              'zh_TW': ('必須是布林值', '在非 HTTP 傳輸中會被忽略'),
              'bn': ('বুলিয়ান মান হতে হবে', 'নন-HTTP ট্রান্সপোর্টে উপেক্ষা করা হয়'),
              'fa': ('باید یک مقدار بولی باشد', 'برای انتقال‌های غیر HTTP نادیده گرفته می‌شود'),
              'mn': ('boolean утга байх ёстой', 'HTTP бус дамжуулалтад үл тоомсорлогдоно'),
              'mr': ('बूलियन मूल्य असणे आवश्यक आहे', 'HTTP नसलेल्या ट्रान्सपोर्टसाठी दुर्लक्षित केले जाते'),
              'el': ('πρέπει να είναι λογική τιμή', 'αγνοείται για μεταφορές που δεν χρησιμοποιούν HTTP'),
              'he': ('חייב להיות ערך בוליאני', 'מתעלמים ממנו בתעבורה שאינה HTTP'),
              'hu': ('logikai értéknek kell lennie', 'nem HTTP-alapú átviteleknél figyelmen kívül marad'),
              'ro': ('trebuie să fie o valoare booleană', 'este ignorat pentru transporturile non-HTTP'),
              'fil': ('dapat ay boolean na halaga', 'hindi pinapansin para sa mga transport na hindi HTTP'),
              'ms': ('mestilah nilai boolean', 'diabaikan untuk pengangkutan bukan HTTP'),
              'da': ('skal være en boolesk værdi', 'ignoreres for transporttyper, der ikke bruger HTTP'),
              'nn': ('må vere ein boolsk verdi', 'blir ignorert for transportar som ikkje bruker HTTP'),
          }

          json_path = Path('src/uagent/tools/mcp_servers_tool.json')
          data = json.loads(json_path.read_text(encoding='utf-8'))
          en_values = {
              'warn.trusted_trace_boolean': 'WARNING: mcp_servers[{idx}].trusted_trace_propagation must be boolean.',
              'warn.trusted_trace_non_http': 'WARNING: mcp_servers[{idx}].trusted_trace_propagation is ignored for non-HTTP transports.',
              'err.trusted_trace_boolean_indexed': 'ERROR: mcp_servers[{idx}].trusted_trace_propagation must be boolean',
              'err.trusted_trace_boolean': 'trusted_trace_propagation must be boolean',
          }
          data['en'].update(en_values)
          catalog_langs = {
              key for key, value in data.items()
              if key != 'en' and isinstance(value, dict)
              and re.fullmatch(r'[a-z]{2,3}(?:_[A-Za-z]{2})?', key)
          }
          assert catalog_langs == set(phrases), (
              sorted(catalog_langs - set(phrases)), sorted(set(phrases) - catalog_langs)
          )
          for lang, (must_bool, ignored_non_http) in phrases.items():
              block = data[lang]
              block['warn.trusted_trace_boolean'] = f'WARNING: mcp_servers[{{idx}}].trusted_trace_propagation {must_bool}.'
              block['warn.trusted_trace_non_http'] = f'WARNING: mcp_servers[{{idx}}].trusted_trace_propagation {ignored_non_http}.'
              block['err.trusted_trace_boolean_indexed'] = f'ERROR: mcp_servers[{{idx}}].trusted_trace_propagation {must_bool}'
              block['err.trusted_trace_boolean'] = f'trusted_trace_propagation {must_bool}'
          json_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          for lang in catalog_langs:
              for key, en_value in en_values.items():
                  value = data[lang].get(key)
                  assert isinstance(value, str) and value.strip(), (lang, key)
                  assert value.strip() != en_value.strip(), (lang, key)
          print('localized trust messages checked:', len(catalog_langs) * len(en_values))
          PY

      - name: Add regression coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_observability_phase3_mcp_config.py')
          text = path.read_text(encoding='utf-8')
          marker = 'def test_mcp_server_trust_messages_are_localized_for_shipped_catalog_blocks()'
          if marker not in text:
              text += '''\n\n\ndef test_mcp_server_trust_messages_are_localized_for_shipped_catalog_blocks() -> None:\n    catalog_path = (\n        Path(__file__).resolve().parents[1]\n        / "src"\n        / "uagent"\n        / "tools"\n        / "mcp_servers_tool.json"\n    )\n    catalog = json.loads(catalog_path.read_text(encoding="utf-8"))\n    keys = {\n        "warn.trusted_trace_boolean",\n        "warn.trusted_trace_non_http",\n        "err.trusted_trace_boolean_indexed",\n        "err.trusted_trace_boolean",\n    }\n    english = catalog["en"]\n    for lang, block in catalog.items():\n        if lang == "en" or not isinstance(block, dict):\n            continue\n        for key in keys:\n            assert key in block, (lang, key)\n            assert isinstance(block[key], str) and block[key].strip(), (lang, key)\n            assert block[key].strip() != english[key].strip(), (lang, key)\n'''
              path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Format and verify
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[core,providers,test]'
          python -m pip install black==26.5.1 ruff
          python -m black src/uagent/tools/mcp_servers_tool.py tests/test_observability_phase3_mcp_config.py
          python -m black --check src/uagent/tools/mcp_servers_tool.py tests/test_observability_phase3_mcp_config.py
          python -m ruff check src/uagent/tools/mcp_servers_tool.py tests/test_observability_phase3_mcp_config.py
          python scripts/tool_json_i18n_batch.py status --tools mcp_servers --langs ja,es,fr,ko,de,it,ru,pt_BR,pt,id,vi,pl,hi,ar,sv,sw,nb,nl,fi,cs,uk,tr,th,zh_CN,zh_TW,bn,fa,mn,mr,el,he,hu,ro,fil,ms,da,nn | tee /tmp/i18n-status.txt
          grep -q '^missing_units: 0$' /tmp/i18n-status.txt
          python -m pytest -q tests/test_observability_phase3_mcp_config.py

      - name: Commit fix and remove temporary workflows
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/zz_pr90_i18n_fix.yml .github/workflows/zz_pr90_i18n_fix2.yml .github/workflows/zz_pr90_i18n_fix3.yml .github/workflows/zz_pr90_i18n_fix4.yml
          git add src/uagent/tools/mcp_servers_tool.py src/uagent/tools/mcp_servers_tool.json tests/test_observability_phase3_mcp_config.py
          git diff --cached --check
          git commit -m 'fix: localize MCP trace trust validation'
          git push origin HEAD:feat/opentelemetry-mcp-config-optin
