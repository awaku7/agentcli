name: Temporary Foundry banner fix

on:
  push:
    branches: [feature/foundry-local-openai-compat]
    paths: [.github/workflows/temp-fix-foundry-banner.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/foundry-local-openai-compat
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Patch banner model resolution
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          banner = Path("src/uagent/runtime/runtime_banner.py")
          text = banner.read_text(encoding="utf-8")
          old = '''        _banner_model = current_model(provider)\n        if provider == "lmstudio":\n'''
          new = '''        _banner_model = current_model(provider)\n        if provider == "foundry_local" and not _banner_model:\n            _banner_model = (\n                env_get("UAGENT_FOUNDRY_LOCAL_DEPNAME", "phi-4-mini")\n                or "phi-4-mini"\n            )\n        if provider == "lmstudio":\n'''
          if old not in text:
              raise SystemExit("runtime_banner anchor not found")
          banner.write_text(text.replace(old, new, 1), encoding="utf-8")

          tests = Path("tests/test_foundry_local_provider_wiring.py")
          text = tests.read_text(encoding="utf-8")
          anchor = '''def test_foundry_local_feature_lookup_is_provider_scoped(monkeypatch) -> None:\n'''
          addition = '''def test_foundry_local_banner_uses_effective_default_model_for_responses_gate(\n    monkeypatch,\n) -> None:\n    import uagent.llmcapa_util as util\n    from uagent.runtime.runtime_banner import build_startup_banner\n\n    seen: dict[str, str] = {}\n\n    def fake_allows(provider, model_id=None):\n        seen["provider"] = provider\n        seen["model_id"] = model_id\n        return False\n\n    monkeypatch.setenv("UAGENT_PROVIDER", "foundry_local")\n    monkeypatch.setenv("UAGENT_RESPONSES", "1")\n    monkeypatch.setenv("UAGENT_FOUNDRY_LOCAL_BASE_URL", "http://localhost:5272/v1")\n    monkeypatch.delenv("UAGENT_FOUNDRY_LOCAL_DEPNAME", raising=False)\n    monkeypatch.delenv("UAGENT_DEPNAME", raising=False)\n    monkeypatch.setattr(util, "provider_allows_responses_api", fake_allows)\n\n    banner = build_startup_banner(\n        core=SimpleNamespace(normalize_url=lambda value: value.rstrip("/")),\n        workdir=".",\n        workdir_source="test",\n    )\n\n    assert seen == {"provider": "foundry_local", "model_id": "phi-4-mini"}\n    assert "ChatCompletions" in banner\n    assert "Responses (UAGENT_RESPONSES is enabled)" not in banner\n\n\n'''
          if anchor not in text:
              raise SystemExit("test anchor not found")
          tests.write_text(text.replace(anchor, addition + anchor, 1), encoding="utf-8")
          PY

          python -m pip install --upgrade pip
          python -m pip install -e ".[core,providers,test]" black ruff
          python -m black src/uagent/runtime/runtime_banner.py tests/test_foundry_local_provider_wiring.py
          python -m ruff check src/uagent/runtime/runtime_banner.py tests/test_foundry_local_provider_wiring.py
          python -m pytest -q tests/test_foundry_local_provider_wiring.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/uagent/runtime/runtime_banner.py tests/test_foundry_local_provider_wiring.py
          git commit -m "fix: align Foundry banner with effective model"
          git push origin HEAD:feature/foundry-local-openai-compat
