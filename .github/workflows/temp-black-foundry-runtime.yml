name: Temporary Black fix for Foundry runtime

on:
  push:
    branches: [feature/foundry-local-openai-compat]
    paths: [.github/workflows/temp-black-foundry-runtime.yml]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          set -euo pipefail
          python -m pip install black
          python -m black src/uagent/providers/openai_compatible_runtime.py
          python -m black --check src/uagent/providers/openai_compatible_runtime.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/temp-black-foundry-runtime.yml
          git add -A
          git commit -m "style: format Foundry runtime capability gate"
          git push origin HEAD:feature/foundry-local-openai-compat
