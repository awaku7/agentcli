name: PR36 Apply

on:
  push:
    branches:
      - fix/session-resume-ambiguity

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/session-resume-ambiguity
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/pr36_patch.py
      - run: python -m pip install -e . pytest black
      - run: python -m black src/uagent/runtime/session_resume.py src/uagent/tools/session_resume_tool.py src/uagent/llm_flow_helpers.py src/uagent/uagent_llm.py tests/test_session_resume.py tests/test_session_resume_tool.py tests/test_session_resume_control_transfer.py
      - run: python -m pytest -q tests/test_session_resume.py tests/test_session_resume_tool.py tests/test_session_resume_control_transfer.py
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/uagent/llm_flow_helpers.py src/uagent/uagent_llm.py tests/test_session_resume_control_transfer.py
          git commit -m "fix: stop tool continuation during session resume"
          git push origin HEAD:fix/session-resume-ambiguity
