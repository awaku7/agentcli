name: Precommit realtime CLI registration fix
on:
  push:
    branches: [feature/admin-process-registry-20261030]
permissions:
  contents: write
concurrency:
  group: uag-realtime-cli-precommit
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-process-registry-20261030
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e . pytest black ruff
      - name: Restore exact candidate before commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          req = Request(
              "https://api.github.com/repos/awaku7/agentcli/git/blobs/38c7939c131fea519cce21f4fbc266412122a537",
              headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
              },
          )
          with urlopen(req, timeout=30) as response:
              data = json.load(response)
          Path("src/uagent/cli_impl/main.py").write_bytes(
              base64.b64decode(data["content"])
          )
          PY
      - run: python -m black src/uagent/cli_impl/main.py
      - run: python -m black --check src/uagent/cli_impl/main.py
      - run: python -m ruff check src/uagent/cli_impl/main.py
      - run: python -m pytest -q tests/test_process_registry.py
      - run: python -m compileall -q src/uagent/cli_impl/main.py
      - name: Commit validated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/uagent/cli_impl/main.py
          git rm .github/workflows/_candidate_realtime_registry.yml
          git commit -m "fix(uag): track realtime CLI after workdir resolution"
          git push origin HEAD:feature/admin-process-registry-20261030
