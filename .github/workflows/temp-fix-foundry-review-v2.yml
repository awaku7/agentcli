name: Temporary Foundry Local review fixes v2

on:
  push:
    branches: [feature/foundry-local-openai-compat]
    paths: [.github/workflows/temp-fix-foundry-review-v2.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/foundry-local-openai-compat
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Patch review findings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"replacement anchor not found: {path}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/uagent/llm_round_helpers.py",
              '''    if responses_env in ("1", "true"):
                  try:
                      from .llmcapa_util import supports_responses_api

                      catalog_responses = supports_responses_api(
                          depname or None, provider, default=None
                      )
                  except Exception:
                      catalog_responses = None
                  if catalog_responses is False:
                      use_responses_api = False
                  elif provider == "lmstudio":
                      from .providers.llm_lmstudio import responses_endpoint_available

                      use_responses_api = responses_endpoint_available(core)
                  else:
                      use_responses_api = True
          ''',
              '''    if responses_env in ("1", "true"):
                  if provider == "foundry_local":
                      try:
                          from .llmcapa_util import supports_responses_api

                          catalog_responses = supports_responses_api(
                              depname or None, provider, default=None
                          )
                      except Exception:
                          catalog_responses = None
                      use_responses_api = catalog_responses is True
                  elif provider == "lmstudio":
                      from .providers.llm_lmstudio import responses_endpoint_available

                      use_responses_api = responses_endpoint_available(core)
                  else:
                      use_responses_api = True
          ''',
          )

          replace_once(
              "src/uagent/runtime/tool_discovery.py",
              '''        if raw_responses in {"1", "true", "yes", "on"}:
                      try:
                          from ..llmcapa_util import supports_responses_api

                          catalog_responses = supports_responses_api(
                              model_name or None, provider_name, default=None
                          )
                      except Exception:
                          catalog_responses = None
                      use_responses_api = catalog_responses is not False
          ''',
              '''        if raw_responses in {"1", "true", "yes", "on"}:
                      if provider_name == "foundry_local":
                          try:
                              from ..llmcapa_util import supports_responses_api

                              catalog_responses = supports_responses_api(
                                  model_name or None, provider_name, default=None
                              )
                          except Exception:
                              catalog_responses = None
                          use_responses_api = catalog_responses is True
                      else:
                          use_responses_api = True
          ''',
          )

          Path("tests/test_foundry_local_routing_regressions.py").write_text(
              textwrap.dedent(
                  '''\
                  """Regression tests for Foundry-only capability gating."""

                  from __future__ import annotations

                  from types import SimpleNamespace

                  from uagent.llm_round_helpers import _resolve_round_runtime_flags


                  def test_explicit_responses_false_catalog_does_not_veto_other_providers(
                      monkeypatch,
                  ) -> None:
                      monkeypatch.setenv("UAGENT_RESPONSES", "1")
                      monkeypatch.setattr(
                          "uagent.llmcapa_util.supports_responses_api",
                          lambda model, provider, default=None: False,
                      )

                      use_responses, _streaming = _resolve_round_runtime_flags(
                          tr_cfg=None,
                          core=SimpleNamespace(),
                          provider="ollama",
                          depname="llama3.3",
                      )

                      assert use_responses is True


                  def test_tool_discovery_explicit_responses_override_remains_non_foundry(
                      monkeypatch,
                  ) -> None:
                      import uagent.runtime.tool_discovery as discovery

                      seen: dict[str, object] = {}
                      monkeypatch.setenv("UAGENT_RESPONSES", "1")
                      monkeypatch.setattr(
                          "uagent.llmcapa_util.supports_responses_api",
                          lambda model, provider, default=None: False,
                      )
                      monkeypatch.setattr(
                          discovery,
                          "resolve_tool_discovery",
                          lambda **kwargs: seen.update(kwargs) or object(),
                      )

                      discovery.resolve_tool_discovery_from_environment(
                          provider="ollama",
                          depname="llama3.3",
                      )

                      assert seen["use_responses_api"] is True


                  def test_tool_discovery_foundry_explicit_responses_requires_positive_evidence(
                      monkeypatch,
                  ) -> None:
                      import uagent.runtime.tool_discovery as discovery

                      seen: dict[str, object] = {}
                      monkeypatch.setenv("UAGENT_RESPONSES", "1")
                      monkeypatch.setattr(
                          "uagent.llmcapa_util.supports_responses_api",
                          lambda model, provider, default=None: False,
                      )
                      monkeypatch.setattr(
                          discovery,
                          "resolve_tool_discovery",
                          lambda **kwargs: seen.update(kwargs) or object(),
                      )

                      discovery.resolve_tool_discovery_from_environment(
                          provider="foundry_local",
                          depname="phi-4-mini",
                      )

                      assert seen["use_responses_api"] is False
                  '''
              ),
              encoding="utf-8",
          )
          PY

          python -m pip install --upgrade pip
          python -m pip install -e ".[core,providers,test]" black ruff
          python -m black \
            src/uagent/llm_round_helpers.py \
            src/uagent/runtime/tool_discovery.py \
            src/uagent/providers/llm_foundry_local.py \
            tests/test_foundry_local_provider.py \
            tests/test_foundry_local_routing_regressions.py
          python -m ruff check \
            src/uagent/llm_round_helpers.py \
            src/uagent/runtime/tool_discovery.py \
            src/uagent/providers/llm_foundry_local.py \
            tests/test_foundry_local_provider.py \
            tests/test_foundry_local_routing_regressions.py
          python -m pytest -q \
            tests/test_foundry_local_provider.py \
            tests/test_foundry_local_provider_wiring.py \
            tests/test_foundry_local_routing_regressions.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/uagent/llm_round_helpers.py \
            src/uagent/runtime/tool_discovery.py \
            src/uagent/providers/llm_foundry_local.py \
            tests/test_foundry_local_provider.py \
            tests/test_foundry_local_routing_regressions.py
          git commit -m "fix: scope Foundry capability gates"
          git push origin HEAD:feature/foundry-local-openai-compat
