name: PR34 I18N Audit Detail

on:
  push:
    branches: [feat/session-natural-resume]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/i18n_structure_audit.py --report outputs/i18n/structure_audit.json || true
      - run: cat outputs/i18n/structure_audit.json
