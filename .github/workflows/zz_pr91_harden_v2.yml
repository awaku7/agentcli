name: PR91 trusted ingress hardening v2

on:
  push:
    branches: [feat/opentelemetry-trusted-ingress]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/opentelemetry-trusted-ingress
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Patch trust boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/uagent/runtime/observability/trusted_ingress.py')
          s = p.read_text(encoding='utf-8')
          anchor = '_T = TypeVar("_T")\n'
          insert = '''_T = TypeVar("_T")
          _RAW_SOCKET_PEER_SCOPE_KEY = "uagent.raw_socket_peer"


          class RawSocketPeerCaptureMiddleware:
              """Capture the real ASGI socket peer before proxy-header rewriting."""

              def __init__(self, app: Any) -> None:
                  self.app = app

              async def __call__(
                  self, scope: dict[str, Any], receive: Any, send: Any
              ) -> None:
                  if scope.get("type") in {"http", "websocket"}:
                      scope[_RAW_SOCKET_PEER_SCOPE_KEY] = scope.get("client")
                  await self.app(scope, receive, send)


          class SingleUseTrustedIngressCarrier:
              """Consume a handshake carrier at most once for Web turn isolation."""

              def __init__(self, carrier: Mapping[str, Any] | None) -> None:
                  self._carrier = _normalize_carrier(carrier)

              def take(self) -> dict[str, str]:
                  carrier = self._carrier
                  self._carrier = {}
                  return dict(carrier)
          '''
          insert = '\n'.join(line[10:] if line.startswith('          ') else line for line in insert.splitlines()) + '\n'
          if '_RAW_SOCKET_PEER_SCOPE_KEY' not in s:
              if anchor not in s:
                  raise SystemExit('trusted ingress anchor missing')
              s = s.replace(anchor, insert, 1)
          old = '''    client = getattr(request, "client", None)
              peer_host = str(getattr(client, "host", "") or "").strip()
              if not peer_host:
                  return {}
          '''
          old = '\n'.join(line[4:] if line.startswith('    ') else line for line in old.splitlines()) + '\n'
          new = '''    scope = getattr(request, "scope", None)
              if not isinstance(scope, Mapping):
                  return {}
              raw_peer = scope.get(_RAW_SOCKET_PEER_SCOPE_KEY)
              if not isinstance(raw_peer, (tuple, list)) or not raw_peer:
                  return {}
              peer_host = str(raw_peer[0] or "").strip()
              if not peer_host:
                  return {}
          '''
          new = '\n'.join(line[4:] if line.startswith('    ') else line for line in new.splitlines()) + '\n'
          if 'client = getattr(request, "client", None)' in s:
              if old not in s:
                  raise SystemExit('peer block missing')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('src/uagent/web_impl/routes_ws.py')
          s = p.read_text(encoding='utf-8')
          if 'SingleUseTrustedIngressCarrier' not in s:
              s = s.replace(
                  'from ..runtime.observability.trusted_ingress import (\n',
                  'from ..runtime.observability.trusted_ingress import (\n    SingleUseTrustedIngressCarrier,\n',
                  1,
              )
          s = s.replace(
              'trusted_trace_carrier = trusted_ingress_carrier_for_request(websocket)',
              'trusted_trace_carrier = SingleUseTrustedIngressCarrier(\n        trusted_ingress_carrier_for_request(websocket)\n    )',
              1,
          )
          s = s.replace('trusted_trace_carrier,\n', 'trusted_trace_carrier.take(),\n')
          if s.count('trusted_trace_carrier.take()') != 2:
              raise SystemExit('single-use carrier replacement count mismatch')
          p.write_text(s, encoding='utf-8')

          p = Path('src/uagent/web_impl/init.py')
          s = p.read_text(encoding='utf-8')
          if 'ProxyHeadersMiddleware' not in s:
              s = s.replace(
                  'from .app import app\n',
                  'from uvicorn.middleware.proxy_headers import ProxyHeadersMiddleware\n\n'
                  'from ..runtime.observability.trusted_ingress import RawSocketPeerCaptureMiddleware\n'
                  'from .app import app\n',
                  1,
              )
          old = '    config = uvicorn.Config(app, host=bind_host, port=port, ws_max_size=10_000_000)\n'
          if old in s:
              s = s.replace(
                  old,
                  '    forwarded_allow_ips = os.environ.get(\n'
                  '        "FORWARDED_ALLOW_IPS", "127.0.0.1,::1"\n'
                  '    )\n'
                  '    proxied_app = ProxyHeadersMiddleware(\n'
                  '        app, trusted_hosts=forwarded_allow_ips\n'
                  '    )\n'
                  '    server_app = RawSocketPeerCaptureMiddleware(proxied_app)\n'
                  '    config = uvicorn.Config(\n'
                  '        server_app,\n'
                  '        host=bind_host,\n'
                  '        port=port,\n'
                  '        ws_max_size=10_000_000,\n'
                  '        proxy_headers=False,\n'
                  '    )\n',
                  1,
              )
          p.write_text(s, encoding='utf-8')

          p = Path('tests/test_observability_phase3_trusted_ingress.py')
          s = p.read_text(encoding='utf-8')
          if 'RawSocketPeerCaptureMiddleware' not in s:
              s = s.replace(
                  'from uagent.runtime.observability.trusted_ingress import (\n',
                  'from uagent.runtime.observability.trusted_ingress import (\n'
                  '    RawSocketPeerCaptureMiddleware,\n'
                  '    SingleUseTrustedIngressCarrier,\n',
                  1,
              )
          old = '''class _Request:
              def __init__(self, host: str, headers: dict[str, str]) -> None:
                  self.client = _Client(host)
                  self.headers = headers
          '''
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines()) + '\n'
          new = '''class _Request:
              def __init__(
                  self,
                  host: str,
                  headers: dict[str, str],
                  *,
                  raw_host: str | None = None,
              ) -> None:
                  self.client = _Client(host)
                  self.headers = headers
                  peer = raw_host if raw_host is not None else host
                  self.scope = {"uagent.raw_socket_peer": (peer, 12345)}
          '''
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines()) + '\n'
          if old in s:
              s = s.replace(old, new, 1)
          spoof_old = '''    request = _Request(
                  "203.0.113.50",
                  {
                      "traceparent": _TRACEPARENT,
                      "x-forwarded-for": "127.0.0.1",
                  },
              )
          '''
          spoof_old = '\n'.join(line[10:] if line.startswith('          ') else line for line in spoof_old.splitlines()) + '\n'
          spoof_new = '''    request = _Request(
                  "127.0.0.1",
                  {
                      "traceparent": _TRACEPARENT,
                      "x-forwarded-for": "127.0.0.1",
                  },
                  raw_host="203.0.113.50",
              )
          '''
          spoof_new = '\n'.join(line[10:] if line.startswith('          ') else line for line in spoof_new.splitlines()) + '\n'
          if spoof_old in s:
              s = s.replace(spoof_old, spoof_new, 1)
          if 'test_raw_peer_capture_runs_before_proxy_rewrite' not in s:
              tests = '''

          def test_raw_peer_capture_runs_before_proxy_rewrite() -> None:
              seen: dict[str, object] = {}

              async def inner(scope, receive, send) -> None:
                  seen["raw"] = scope.get("uagent.raw_socket_peer")
                  scope["client"] = ("198.51.100.42", 0)
                  seen["client"] = scope.get("client")

              middleware = RawSocketPeerCaptureMiddleware(inner)

              import asyncio

              asyncio.run(
                  middleware(
                      {"type": "websocket", "client": ("127.0.0.1", 4321)},
                      None,
                      None,
                  )
              )

              assert seen == {
                  "raw": ("127.0.0.1", 4321),
                  "client": ("198.51.100.42", 0),
              }


          def test_handshake_carrier_is_consumed_once() -> None:
              carrier = SingleUseTrustedIngressCarrier(
                  {"traceparent": _TRACEPARENT, "tracestate": _TRACESTATE}
              )

              assert carrier.take() == {
                  "traceparent": _TRACEPARENT,
                  "tracestate": _TRACESTATE,
              }
              assert carrier.take() == {}
          '''
              tests = '\n'.join(line[10:] if line.startswith('          ') else line for line in tests.splitlines())
              anchor = '\n\ndef test_trusted_ingress_binding_is_scoped() -> None:\n'
              if anchor not in s:
                  raise SystemExit('test insertion anchor missing')
              s = s.replace(anchor, tests + anchor, 1)
          p.write_text(s, encoding='utf-8')

          for name in (
              'src/uagent/docs/DEVELOP_OBSERVABILITY.md',
              'docs/UAG_OPENTELEMETRY_PHASE3_SCOPE.md',
          ):
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              s = s.replace('actual socket peer', 'raw socket peer captured before proxy-header rewriting')
              if name.endswith('DEVELOP_OBSERVABILITY.md') and 'handshake carrier is single-use' not in s:
                  marker = '- The Web connection is authenticated and authorized before UAG resolves the trusted trace carrier.'
                  s = s.replace(
                      marker,
                      '- A WebSocket handshake carrier is single-use: it may parent only the first Agent execution started by that connection. Later turns return to fresh Agent roots.\n' + marker,
                      1,
                  )
              if name.endswith('PHASE3_SCOPE.md') and 'consume a WebSocket handshake carrier at most once' not in s:
                  marker = '- copy only `traceparent` / `tracestate` into the worker thread\'s process-local observability context;'
                  s = s.replace(
                      marker,
                      marker + '\n- consume a WebSocket handshake carrier at most once so later turns start fresh traces;',
                      1,
                  )
              p.write_text(s, encoding='utf-8')
          PY
      - name: Format and validate
        shell: bash
        run: |
          python -m pip install -q black==26.5.1 ruff
          python -m black src/uagent/runtime/observability/trusted_ingress.py src/uagent/runtime/execution.py src/uagent/web_impl/routes_ws.py src/uagent/web_impl/init.py tests/test_observability_phase3_trusted_ingress.py
          python -m black --check src/uagent/runtime/observability/trusted_ingress.py src/uagent/runtime/execution.py src/uagent/web_impl/routes_ws.py src/uagent/web_impl/init.py tests/test_observability_phase3_trusted_ingress.py
          python -m ruff check src/uagent/runtime/observability/trusted_ingress.py src/uagent/runtime/execution.py src/uagent/web_impl/routes_ws.py src/uagent/web_impl/init.py tests/test_observability_phase3_trusted_ingress.py
          python -m pip install -q -e ".[core,providers,test]"
          python -m pytest -q tests/test_observability_phase3_trusted_ingress.py tests/test_observability_runtime_tracing.py tests/test_web_connection_identity.py
      - name: Commit
        shell: bash
        run: |
          git rm .github/workflows/zz_pr91_harden_v2.yml
          git config user.name "Hirofumi Ukawa"
          git config user.email "35913787+awaku7@users.noreply.github.com"
          git add docs/UAG_OPENTELEMETRY_PHASE3_SCOPE.md src/uagent/docs/DEVELOP_OBSERVABILITY.md src/uagent/runtime/execution.py src/uagent/runtime/observability/trusted_ingress.py src/uagent/web_impl/routes_ws.py src/uagent/web_impl/init.py tests/test_observability_phase3_trusted_ingress.py
          git commit -m "fix: harden trusted Web trace ingress"
          git push origin HEAD:feat/opentelemetry-trusted-ingress
