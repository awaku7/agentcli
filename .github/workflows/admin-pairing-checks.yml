name: Admin pairing export checks

on:
  pull_request:
    paths:
      - "src/uagent/admin_pairing.py"
      - "src/uagent/cli_entry.py"
      - "src/uagent/web_impl/app.py"
      - "src/uagent/runtime/observability/otel_backend.py"
      - "tests/test_admin_pairing_export.py"
      - "tests/test_otel_exporter_fail_stop.py"
      - "tests/test_observability_settings.py"
      - ".github/workflows/admin-pairing-checks.yml"
  push:
    branches: [feature/admin-pairing-export-20261029]
  workflow_dispatch:

jobs:
  pairing:
    runs-on: ubuntu-latest
    env:
      UAGENT_AUTO_INSTALL: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[core,web]" pytest black==26.10.0 ruff==0.16.10 opentelemetry-api==1.44.0 opentelemetry-sdk==1.44.0 opentelemetry-exporter-otlp==1.44.0
      - run: python -m black --check src/uagent/admin_pairing.py src/uagent/cli_entry.py src/uagent/web_impl/app.py src/uagent/runtime/observability/otel_backend.py tests/test_admin_pairing_export.py
      - run: python -m ruff check src/uagent/admin_pairing.py src/uagent/cli_entry.py src/uagent/web_impl/app.py src/uagent/runtime/observability/otel_backend.py tests/test_admin_pairing_export.py
      - run: python -c "import opentelemetry.sdk; import opentelemetry.proto.collector.trace.v1.trace_service_pb2; import opentelemetry.exporter.otlp.proto.http.trace_exporter"
      - run: python -m pytest -q tests/test_admin_pairing_export.py tests/test_otel_backend_runtime.py tests/test_otel_exporter_fail_stop.py tests/test_observability_settings.py

  pairing-windows:
    runs-on: windows-latest
    env:
      UAGENT_AUTO_INSTALL: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[core,web]" pytest opentelemetry-api==1.44.0 opentelemetry-sdk==1.44.0 opentelemetry-exporter-otlp==1.44.0
      - run: python -c "import opentelemetry.sdk; import opentelemetry.proto.collector.trace.v1.trace_service_pb2; import opentelemetry.exporter.otlp.proto.http.trace_exporter"
      - run: python -m pytest -q tests/test_admin_pairing_export.py tests/test_otel_exporter_fail_stop.py tests/test_observability_settings.py
