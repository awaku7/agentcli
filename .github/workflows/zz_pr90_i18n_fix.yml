name: PR90 MCP i18n fix

on:
  push:
    branches:
      - feat/opentelemetry-mcp-config-optin

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/opentelemetry-mcp-config-optin
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Patch trust messages through tool translator
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          py_path = Path('src/uagent/tools/mcp_servers_tool.py')
          text = py_path.read_text(encoding='utf-8')

          old = '''            warnings.append(
                f"WARNING: mcp_servers[{idx}].trusted_trace_propagation must be boolean."
            )'''
          new = '''            warnings.append(
                _(
                    "warn.trusted_trace_boolean",
                    default="WARNING: mcp_servers[{idx}].trusted_trace_propagation must be boolean.",
                ).format(idx=idx)
            )'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''            warnings.append(
                f"WARNING: mcp_servers[{idx}].trusted_trace_propagation is ignored for non-HTTP transports."
            )'''
          new = '''            warnings.append(
                _(
                    "warn.trusted_trace_non_http",
                    default=(
                        "WARNING: mcp_servers[{idx}].trusted_trace_propagation is ignored "
                        "for non-HTTP transports."
                    ),
                ).format(idx=idx)
            )'''
          assert text.count(old) == 2
          text = text.replace(old, new)

          old = '''            errors.append(
                f"ERROR: mcp_servers[{idx}].trusted_trace_propagation must be boolean"
            )'''
          new = '''            errors.append(
                _(
                    "err.trusted_trace_boolean_indexed",
                    default="ERROR: mcp_servers[{idx}].trusted_trace_propagation must be boolean",
                ).format(idx=idx)
            )'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '"error": "trusted_trace_propagation must be boolean",'
          new = '''"error": _(
                    "err.trusted_trace_boolean",
                    default="trusted_trace_propagation must be boolean",
                ),'''
          assert text.count(old) == 2
          text = text.replace(old, new)
          py_path.write_text(text, encoding='utf-8', newline='\n')

          json_path = Path('src/uagent/tools/mcp_servers_tool.json')
          data = json.loads(json_path.read_text(encoding='utf-8'))
          en = data['en']
          additions = {
              'warn.trusted_trace_boolean': 'WARNING: mcp_servers[{idx}].trusted_trace_propagation must be boolean.',
              'warn.trusted_trace_non_http': 'WARNING: mcp_servers[{idx}].trusted_trace_propagation is ignored for non-HTTP transports.',
              'err.trusted_trace_boolean_indexed': 'ERROR: mcp_servers[{idx}].trusted_trace_propagation must be boolean',
              'err.trusted_trace_boolean': 'trusted_trace_propagation must be boolean',
          }
          en.update(additions)
          json_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          langs = [
              key for key, value in data.items()
              if key != 'en' and isinstance(value, dict)
              and re.fullmatch(r'[a-z]{2,3}(?:_[A-Za-z]{2})?', key)
          ]
          Path('/tmp/pr90_langs').write_text(','.join(langs), encoding='utf-8')
          print('catalog languages:', ','.join(langs))
          PY

      - name: Translate new catalog keys for every shipped tool locale
        shell: bash
        run: |
          LANGS="$(cat /tmp/pr90_langs)"
          python scripts/tool_json_i18n_batch.py run \
            --tools mcp_servers \
            --langs "$LANGS" \
            --keys warn.trusted_trace_boolean,warn.trusted_trace_non_http,err.trusted_trace_boolean_indexed,err.trusted_trace_boolean \
            --apply --sleep 0.2
          rm -rf tmp/tool_json_i18n
          rm -f src/uagent/tools/mcp_servers_tool.json.i18n.bak

      - name: Assert localized catalog coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          path = Path('src/uagent/tools/mcp_servers_tool.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          keys = (
              'warn.trusted_trace_boolean',
              'warn.trusted_trace_non_http',
              'err.trusted_trace_boolean_indexed',
              'err.trusted_trace_boolean',
          )
          en = data['en']
          checked = 0
          for lang, block in data.items():
              if lang == 'en' or not isinstance(block, dict):
                  continue
              if not re.fullmatch(r'[a-z]{2,3}(?:_[A-Za-z]{2})?', lang):
                  continue
              for key in keys:
                  value = block.get(key)
                  assert isinstance(value, str) and value.strip(), (lang, key, value)
                  assert value.strip() != en[key].strip(), (lang, key, 'same as English')
                  checked += 1
          print('localized trust messages checked:', checked)
          PY

      - name: Add regression coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_observability_phase3_mcp_config.py')
          text = path.read_text(encoding='utf-8')
          marker = 'def test_mcp_server_trust_messages_are_localized_for_shipped_catalog_blocks()'
          if marker not in text:
              text += '''\n\n\ndef test_mcp_server_trust_messages_are_localized_for_shipped_catalog_blocks() -> None:\n    catalog_path = (\n        Path(__file__).resolve().parents[1]\n        / "src"\n        / "uagent"\n        / "tools"\n        / "mcp_servers_tool.json"\n    )\n    catalog = json.loads(catalog_path.read_text(encoding="utf-8"))\n    keys = {\n        "warn.trusted_trace_boolean",\n        "warn.trusted_trace_non_http",\n        "err.trusted_trace_boolean_indexed",\n        "err.trusted_trace_boolean",\n    }\n    english = catalog["en"]\n    for lang, block in catalog.items():\n        if lang == "en" or not isinstance(block, dict):\n            continue\n        for key in keys:\n            assert key in block, (lang, key)\n            assert isinstance(block[key], str) and block[key].strip(), (lang, key)\n            assert block[key].strip() != english[key].strip(), (lang, key)\n'''
              path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Verify formatting and focused tests
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[core,providers,test]'
          python -m pip install black==26.5.1 ruff
          python -m black --check src/uagent/tools/mcp_servers_tool.py tests/test_observability_phase3_mcp_config.py
          python -m ruff check src/uagent/tools/mcp_servers_tool.py tests/test_observability_phase3_mcp_config.py
          python scripts/tool_json_i18n_batch.py status --tools mcp_servers --langs "$(cat /tmp/pr90_langs)"
          python -m pytest -q tests/test_observability_phase3_mcp_config.py

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/zz_pr90_i18n_fix.yml
          git add src/uagent/tools/mcp_servers_tool.py src/uagent/tools/mcp_servers_tool.json tests/test_observability_phase3_mcp_config.py
          git diff --cached --check
          git commit -m 'fix: localize MCP trace trust validation'
          git push origin HEAD:feat/opentelemetry-mcp-config-optin
