name: Verify atomic Supervisor credential rotation
on:
  push:
    branches: [feature/supervisor-file-pairing-20261030]
  pull_request:
    branches: [feature/admin-process-registry-20261030]
permissions:
  contents: write
concurrency:
  group: uag-atomic-supervisor-rotation
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/supervisor-file-pairing-20261030
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e . black ruff pytest
      - name: Exact candidate source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, json, os
          from pathlib import Path
          from urllib.request import Request, urlopen
          blobs = {
              "src/uagent/admin_pairing.py": "dd341f5397e6fe7d5c709b89354c404db52ac4df",
              "tests/test_admin_pairing_export.py": "1e6652593a46edee20092805577384647a59f918",
              "docs/UAG_ADMIN_FILE_PAIRING.md": "d52dd2bf539c9a5cfb5d84b50b17df13e149e094",
          }
          for path, sha in blobs.items():
              req = Request(
                  "https://api.github.com/repos/awaku7/agentcli/git/blobs/" + sha,
                  headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"},
              )
              with urlopen(req, timeout=30) as resp:
                  data = json.load(resp)
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(base64.b64decode(data["content"]))
          PY
      - run: python -m black src/uagent/admin_pairing.py tests/test_admin_pairing_export.py
      - run: python -m black --check src/uagent/admin_pairing.py tests/test_admin_pairing_export.py
      - run: python -m ruff check src/uagent/admin_pairing.py tests/test_admin_pairing_export.py
      - run: python -m pytest -q tests/test_admin_pairing_export.py
  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/supervisor-file-pairing-20261030
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e . black ruff pytest
      - name: Recover tested uncommitted blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, json, os
          from pathlib import Path
          from urllib.request import Request, urlopen
          blobs = {
              "src/uagent/admin_pairing.py": "dd341f5397e6fe7d5c709b89354c404db52ac4df",
              "tests/test_admin_pairing_export.py": "1e6652593a46edee20092805577384647a59f918",
              "docs/UAG_ADMIN_FILE_PAIRING.md": "d52dd2bf539c9a5cfb5d84b50b17df13e149e094",
          }
          for path, sha in blobs.items():
              req = Request(
                  "https://api.github.com/repos/awaku7/agentcli/git/blobs/" + sha,
                  headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"},
              )
              with urlopen(req, timeout=30) as resp:
                  data = json.load(resp)
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(base64.b64decode(data["content"]))
          PY
      - run: python -m black src/uagent/admin_pairing.py tests/test_admin_pairing_export.py
      - run: python -m black --check src/uagent/admin_pairing.py tests/test_admin_pairing_export.py
      - run: python -m ruff check src/uagent/admin_pairing.py tests/test_admin_pairing_export.py
      - run: python -m pytest -q tests/test_admin_pairing_export.py
      - name: Commit validated credentials implementation
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.head_ref == 'feature/supervisor-file-pairing-20261030')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/uagent/admin_pairing.py tests/test_admin_pairing_export.py docs/UAG_ADMIN_FILE_PAIRING.md
          git rm .github/workflows/_candidate_atomic_pairing_rotation.yml
          git commit -m "fix(uag): rotate Supervisor bearer atomically with paired credentials"
          git push origin HEAD:feature/supervisor-file-pairing-20261030
