name: PR38 Verify

on:
  push:
    branches:
      - feat/session-resume-time-ranges

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/session-resume-time-ranges
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[core,providers,test]" black ruff
      - run: python -m ruff check src/uagent/runtime/session_resume.py src/uagent/tools/session_resume_tool.py tests/test_session_resume.py tests/test_session_resume_tool.py tests/test_session_resume_time_ranges.py
      - run: python -m black --check src/uagent/runtime/session_resume.py src/uagent/tools/session_resume_tool.py tests/test_session_resume.py tests/test_session_resume_tool.py tests/test_session_resume_time_ranges.py
      - run: python -m pytest -q tests/test_session_resume.py tests/test_session_resume_tool.py tests/test_session_resume_time_ranges.py tests/test_session_resume_control_transfer.py
      - run: python scripts/i18n_validate.py src/uagent/tools/session_resume_tool.json
      - run: python scripts/i18n_structure_audit.py --strict --report outputs/i18n/pr38_structure_audit.json
