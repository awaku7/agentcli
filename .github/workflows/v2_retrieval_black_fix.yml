name: Format V2 retrieval precision fix

on:
  push:
    branches:
      - fix/memory-v2-retrieval-precision
    paths:
      - .github/workflows/v2_retrieval_black_fix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/memory-v2-retrieval-precision
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Format changed Python files
        run: |
          python -m pip install black==26.5.1
          python -m black src/uagent/runtime/memory_retrieval.py tests/test_memory_shadow_retrieval.py
          rm .github/workflows/v2_retrieval_black_fix.yml

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style: format Memory V2 retrieval precision fix"
          git push origin HEAD:fix/memory-v2-retrieval-precision
