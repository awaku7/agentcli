name: PR89 review fix

on:
  push:
    branches:
      - feat/opentelemetry-mcp-http-propagation

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/opentelemetry-mcp-http-propagation
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply owned-client cleanup fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/uagent/tools/mcp/client.py')
          text = path.read_text(encoding='utf-8')
          old = '''                    self._http_client = create_mcp_http_client(
                        self.http_config,
                        headers=self.headers,
                        auth=auth,
                        trusted_trace_propagation=self.trusted_trace_propagation,
                    )
                    self._owns_http_client = True
'''
          new = '''                    self._http_client = create_mcp_http_client(
                        self.http_config,
                        headers=self.headers,
                        auth=auth,
                        trusted_trace_propagation=self.trusted_trace_propagation,
                    )
                    self._owns_http_client = True
                    self._stack.push_async_callback(self._close_owned_http_client)
'''
          if text.count(old) != 1:
              raise SystemExit(f'client create block mismatch: {text.count(old)}')
          text = text.replace(old, new)

          old = '''    async def __aexit__(self, exc_type: Any, exc: Any, tb: Any) -> None:
        if self._stateless_client is not None:
            await self._stateless_client.__aexit__(exc_type, exc, tb)
            self._stateless_client = None
        await self._stack.aclose()
        if self._owns_http_client and self._http_client is not None:
            await self._http_client.aclose()
            self._http_client = None

    def _protocol_version(self) -> str | None:
'''
          new = '''    async def _close_owned_http_client(self) -> None:
        client = self._http_client
        if not self._owns_http_client or client is None:
            return
        self._http_client = None
        try:
            await client.aclose()
        except Exception:
            # Cleanup must never replace the original MCP transport failure.
            pass

    async def __aexit__(self, exc_type: Any, exc: Any, tb: Any) -> None:
        if self._stateless_client is not None:
            await self._stateless_client.__aexit__(exc_type, exc, tb)
            self._stateless_client = None
        await self._stack.aclose()
        await self._close_owned_http_client()

    def _protocol_version(self) -> str | None:
'''
          if text.count(old) != 1:
              raise SystemExit(f'client exit block mismatch: {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')

          test = Path('tests/test_observability_phase3_mcp.py')
          text = test.read_text(encoding='utf-8')
          addition = '''\n\ndef test_stateful_setup_failure_closes_owned_trace_http_client(monkeypatch) -> None:
    class _OwnedClient:
        def __init__(self) -> None:
            self.closed = False

        async def aclose(self) -> None:
            self.closed = True

    owned = _OwnedClient()

    def fake_create(*args, **kwargs):
        assert kwargs.get("trusted_trace_propagation") is True
        return owned

    class _FailingTransport:
        async def __aenter__(self):
            raise RuntimeError("transport setup failed")

        async def __aexit__(self, exc_type, exc, tb):
            return None

    def fake_streamable_http_client(*args, **kwargs):
        assert kwargs.get("http_client") is owned
        return _FailingTransport()

    monkeypatch.setattr("uagent.tools.mcp.client.create_mcp_http_client", fake_create)
    monkeypatch.setattr(
        "uagent.tools.mcp.client.streamable_http_client",
        fake_streamable_http_client,
    )

    from uagent.tools.mcp.client import MCPClient
    from uagent.tools.mcp.errors import MCPTransportError

    async def scenario() -> None:
        client = MCPClient(
            url="https://mcp.example/mcp",
            trusted_trace_propagation=True,
        )
        try:
            await client.__aenter__()
        except MCPTransportError:
            pass
        else:
            raise AssertionError("expected MCPTransportError")
        assert owned.closed is True
        assert client._http_client is None

    asyncio.run(scenario())
'''
          if 'def test_stateful_setup_failure_closes_owned_trace_http_client' in text:
              raise SystemExit('test already present')
          test.write_text(text.rstrip() + addition + '\n', encoding='utf-8')
          PY
      - name: Format and run targeted tests
        shell: bash
        run: |
          python -m pip install -e ".[core,providers,test]"
          python -m pip install black==26.5.1
          python -m black src/uagent/tools/mcp/client.py tests/test_observability_phase3_mcp.py
          python -m black --check src/uagent/tools/mcp/client.py tests/test_observability_phase3_mcp.py
          python -m pytest -q tests/test_observability_phase3_mcp.py
          git diff --check
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr89-review-fix.yml
          git add src/uagent/tools/mcp/client.py tests/test_observability_phase3_mcp.py
          git diff --cached --check
          git commit -m "fix: close owned MCP HTTP client on setup failure"
          git push origin HEAD:feat/opentelemetry-mcp-http-propagation
