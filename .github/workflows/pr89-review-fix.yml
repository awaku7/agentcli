name: PR89 review fix

on:
  push:
    branches:
      - feat/opentelemetry-mcp-http-propagation

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/opentelemetry-mcp-http-propagation
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply owned-client cleanup fix
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/pr89_fix.py
          python /tmp/pr89_fix.py
      - name: Format and run targeted tests
        shell: bash
        run: |
          python -m pip install -e ".[core,providers,test]"
          python -m pip install black==26.5.1
          python -m black src/uagent/tools/mcp/client.py tests/test_observability_phase3_mcp.py
          python -m black --check src/uagent/tools/mcp/client.py tests/test_observability_phase3_mcp.py
          python -m pytest -q tests/test_observability_phase3_mcp.py
          git diff --check
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr89-review-fix.yml
          git add src/uagent/tools/mcp/client.py tests/test_observability_phase3_mcp.py
          git diff --cached --check
          git commit -m "fix: close owned MCP HTTP client on setup failure"
          git push origin HEAD:feat/opentelemetry-mcp-http-propagation
