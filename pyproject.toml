[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "uag"
version = "0.5.68"
description = "A powerful tool execution agent"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "Hirofumi Ukawa", email = "hirofumi@ukawa.biz" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "openai>=2.45.0",
    "anthropic>=0.116.0",
    "google-genai>=2.11.0",
    "xai-sdk>=1.17.0",
    "requests>=2.33.1",
    "httpx>=0.28.1",
    "urllib3>=2.6.3",
    "python-dotenv>=1.2.2",
    "tqdm>=4.67.3",
    "prompt-toolkit>=3.0.52",
    "llmcapa>=0.4.9",
    "pyyaml>=6.0.3",
    "certifi>=2026.2.25",
    "numpy>=2.4.4",
    "pyreadline3>=3.5.4; sys_platform == 'win32'",
    "pywin32>=311; sys_platform == 'win32'",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.22",
    "websockets>=16.0",
]

[project.optional-dependencies]
zai = ["zai-sdk"]
realtime = ["sounddevice>=0.5.0"]
realtime-aec = ["sounddevice>=0.5.0", "webrtc-audio-processing>=0.1.3"]

[project.scripts]

uag = "uagent.cli:main"
uaga = "uagent.a2a.server:main"
uag_setup = "uagent.setup_cli:main"
uagw = "uagent.web:main"
uag_envsec = "uag_envsec.cli:main"

[project.gui-scripts]

uagg = "uagent.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["uagent", "uagent.*", "uag_envsec", "uag_envsec.*"]
exclude = ["uagent.mcp*", "test*", "tests*"]

[tool.setuptools.package-data]
uagent = [
    "tools/**/*",
    "tools_rust/*_tool.py",
    "static/**/*",
    "templates/**/*",
    "locales/**/*",
    "docs/**/*"
]

[tool.ruff]
# Ruff settings
line-length = 88
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
# Keep this conservative to avoid large semantic changes.
# We explicitly ignore E501 because this repo contains many long Japanese strings
# (SYSTEM_PROMPT, tool specs) that are not worth wrapping.
select = [
  "E",  # pycodestyle errors
  "F",  # pyflakes
]
ignore = [
  "E501", # line too long
  "E701", # multiple statements on one line (colon) — compact parser style
  "E702", # multiple statements on one line (semicolon) — compact parser style
]

# E402 (imports not at top) is intentionally allowed in tool modules because
# they initialize the i18n translator at module import time.

[tool.ruff.lint.per-file-ignores]
"src/uagent/*.py" = ["E402"]
"src/uagent/**/*.py" = ["E402"]
"src/uag_envsec/*.py" = ["E402"]
"src/uag_envsec/**/*.py" = ["E402"]
"src/uagent/tools/*.py" = ["E402"]
"src/uagent/tools/**/*.py" = ["E402"]

fixable = ["ALL"]
unfixable = []


[tool.black]
line-length = 88
target-version = ["py311"]

[tool.mypy]
# Policy: reduce noise first (Project decision: 2b)
python_version = "3.11"
ignore_missing_imports = true
no_implicit_optional = false
check_untyped_defs = false
warn_unused_ignores = false
show_error_codes = true
pretty = true
# CI-friendly: reduce noise first
# - var-annotated: require annotations for local vars
# - misc: various strictness checks (e.g., assigning None to typed class)
disable_error_code = [
  "var-annotated",
  "misc",
  "attr-defined",
  "call-arg",
  "call-overload",
  "assignment",
  "operator",
  "arg-type",
  "union-attr",
  "index",
  "no-redef",
]

# Ensure mypy resolves packages under src/ as the package base.
mypy_path = ["typings", "src"]
explicit_package_bases = true
# Limit to library package only.
packages = ["uagent"]

# numpy>=2.5 stubs use PEP 695 `type` statements (Python 3.12+). Keep
# mypy python_version at 3.11 (project minimum) and do not parse those stubs.
[[tool.mypy.overrides]]
module = [
    "numpy",
    "numpy.*",
]
follow_imports = "skip"
