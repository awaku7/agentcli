# Translation extraction rules for uagent.
#
# Scope:
# - include runtime/common packages only
# - exclude src/uagent/tools, tests, and project scripts
#
# Adjust this file if new runtime packages are added.
# The shared side-effect policy lives under tools/ but uses host gettext,
# so it is included explicitly below.

[python: src/uagent/*.py]
encoding = utf-8
keywords = _ _t tr ngettext:1,2

[python: src/uagent/computer_use/*.py]
encoding = utf-8
keywords = _ _t tr ngettext:1,2

[python: src/uagent/tools/tool_policy.py]
encoding = utf-8
keywords = _ _t tr ngettext:1,2

[python: src/uagent/a2a/*.py]
encoding = utf-8
keywords = _ _t tr ngettext:1,2

[python: src/uagent/docs/*.py]
encoding = utf-8
keywords = _ _t tr ngettext:1,2

[python: src/uagent/utils/*.py]
encoding = utf-8
keywords = _ _t tr ngettext:1,2

[python: src/uagent/providers/*.py]
encoding = utf-8
keywords = _ _t tr ngettext:1,2

[python: src/uagent/runtime/*.py]
encoding = utf-8
keywords = _ _t tr ngettext:1,2

[python: src/uagent/scheduler/*.py]
encoding = utf-8
keywords = _ _t tr ngettext:1,2

[python: src/uag_envsec/*.py]
encoding = utf-8
keywords = _ _t tr ngettext:1,2
